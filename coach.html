<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coach · Training</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4f1ea;--card:#fffdf9;--ink:#22303c;--muted:#6b7884;--line:#e0d9c9;--navy:#16324f;

    --shadow:0 1px 3px rgba(40,50,60,.06),0 5px 18px rgba(40,50,60,.07);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:80px;}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px;}
  header{background:linear-gradient(180deg,#16324f,#1c3e60);color:#f7f3ea;padding:20px 18px;box-shadow:var(--shadow);}
  header .inner{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  header h1{font-family:"Fraunces",serif;font-weight:600;font-size:22px;margin:0;flex:1;}
  header .crumb{font-size:13px;opacity:.85;cursor:pointer;}
  header .crumb:hover{text-decoration:underline;}

  .btn.primary{background:var(--navy);color:#fff;}
  .btn.light{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  .btn.danger{background:transparent;color:var(--red);border:1.5px solid #e0bdbd;}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:9px;}
  .btn:active{transform:scale(.98);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden;}
  .card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .card-h h2{font-size:17px;margin:0;flex:1;font-weight:700;}
  .card-b{padding:14px 16px;}

  .roster-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #f0ebdf;cursor:pointer;}
  .roster-row:hover{background:#f7f3ea;}
  .roster-row:first-child{border-top:none;}
  .avatar{width:40px;height:40px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;}
  .roster-row .nm{flex:1;}.roster-row .nm b{font-size:16.5px;}
  .roster-row .nm .slug{font-size:13px;color:var(--muted);font-family:ui-monospace,monospace;}
  .roster-row .arrow{color:var(--muted);}

  label.fld{display:block;margin:9px 0;}
  label.fld span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:3px;}
  input.in,textarea.in,select.in{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);}
  input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--strength);}
  textarea.in{resize:vertical;min-height:40px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}.row2>*{flex:1;min-width:140px;}

  .tabs{display:flex;gap:6px;margin:6px 0 0;flex-wrap:wrap;}
  .tab{padding:9px 15px;border-radius:11px 11px 0 0;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--muted);border:1.5px solid transparent;border-bottom:none;}
  .tab.on{background:var(--card);color:var(--ink);border-color:var(--line);}

  .day{border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden;background:#fffefb;}

  .day-h input.focusin{flex:1;min-width:130px;}
  .ctrl{display:flex;align-items:center;gap:3px;}
  .ctrl .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .restbox{display:flex;gap:5px;align-items:center;white-space:nowrap;font-size:13px;color:var(--muted);font-weight:700;border:1.5px solid var(--line);border-radius:9px;padding:5px 9px;background:#fff;}
  .day-b{padding:11px 13px;}
  .blk{border:1px solid var(--line);border-left:5px solid var(--strength);border-radius:0 11px 11px 0;margin:10px 0;padding:11px;background:#fff;}
  .blk[data-kind="cardio"]{border-left-color:var(--cardio);}
  .blk[data-kind="accessory"]{border-left-color:var(--accessory);}
  .blk[data-kind="core"]{border-left-color:var(--core);}
  .blk-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .ex{display:flex;gap:7px;align-items:flex-start;padding:8px;border:1px solid #eee4d2;border-radius:10px;margin:7px 0;background:#fffdf8;flex-wrap:wrap;}
  .ex .grow{flex:1;min-width:160px;}
  .ex .reorder{display:flex;flex-direction:column;gap:2px;}
  .ex .reorder button{border:none;background:#eee;border-radius:5px;width:24px;height:20px;cursor:pointer;font-size:11px;line-height:1;color:#555;}
  .muted{color:var(--muted);font-size:13px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:120;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#9a3b3b;}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,241,234,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 18px;}
  .savebar .inner{max-width:940px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:flex-end;}

  /* calendar */
  .cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .cal-top .mlabel{font-family:"Fraunces",serif;font-size:19px;font-weight:600;min-width:160px;text-align:center;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .calhead{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:2px 0;}
  .calcell{min-height:64px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
  .calcell.empty{background:transparent;border:none;cursor:default;}
  .calcell .dnum{font-size:12px;color:var(--muted);font-weight:700;}
  .calcell.today{border-color:var(--cardio);box-shadow:0 0 0 1.5px var(--cardio) inset;}
  .calcell.sel{box-shadow:0 0 0 2px var(--navy) inset;border-color:var(--navy);}
  .calcell .tag2{font-size:11px;line-height:1.2;border-radius:6px;padding:2px 4px;font-weight:600;}
  .calcell.done .tag2{background:#e3f2ee;color:#1f6f63;}
  .calcell.planned .tag2{background:#eef2f8;color:#3b6ea5;}
  .calcell.rest .tag2{background:#f0ece2;color:#8a7a55;}
  .calcell.custom{border-color:#cdbfe0;}
  .calcell.custom .tag2{background:#efe9f5;color:#6a4f8f;}
  .detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .detail h3{font-family:"Fraunces",serif;font-size:18px;margin:0 0 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;margin-left:6px;}
  .pill.done{background:#e3f2ee;color:#1f6f63;}.pill.planned{background:#eef2f8;color:#3b6ea5;}

  .logday{border:1px solid var(--line);border-radius:12px;margin:11px 0;overflow:hidden;}
  .logday h4{margin:0;padding:10px 13px;background:#f1ece1;font-size:15px;}
  .logrow{display:flex;gap:9px;align-items:center;padding:8px 13px;border-top:1px solid #f0ebdf;font-size:14px;flex-wrap:wrap;}
  .logrow .lx{flex:1;min-width:140px;font-weight:600;}.logrow .v{color:var(--muted);}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);}
  .empty .big{font-family:"Fraunces",serif;font-size:22px;color:var(--ink);margin-bottom:6px;}
  code{background:#eee4d2;padding:1px 6px;border-radius:5px;font-size:13px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,28,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto;}
  .modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden;}
  .modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .modal-h h3{margin:0;flex:1;font-size:17px;}
  .modal-b{padding:14px 16px;max-height:60vh;overflow:auto;}
  .libitem{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer;background:#fff;}
  .libitem:hover{background:#f7f3ea;}
  .libitem .li-nm{flex:1;}.libitem .li-nm b{font-size:15px;}
  .kindbadge{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:2px 6px;}
  .kindbadge.strength{background:#eaf1f8;color:#3b6ea5;}.kindbadge.cardio{background:#e3f2f0;color:#2f8f86;}
  .kindbadge.accessory{background:#eef4ea;color:#4f7a42;}.kindbadge.core{background:#f8ece4;color:#c2754e;}
</style>
</head>

function renderRoster(){
  let h=`<div class="card"><div class="card-h"><h2>Athletes</h2>
    <button class="btn light sm" onclick="openLibrary()">📚 Exercise library</button>
    <button class="btn light sm" onclick="openGroups()">🧩 Groups</button>
    <button class="btn light sm" onclick="openTemplates()">🗂 Weekly templates</button>
    <button class="btn primary sm" onclick="newAthlete()">+ Add athlete</button></div>`;
  if(!roster.length)h+=`<div class="empty"><div class="big">No athletes yet</div>Add your first person to assign them a program.</div>`;
  else roster.forEach(a=>{h+=`<div class="roster-row" onclick="openAthlete('${a.id}')"><div class="avatar">${esc((a.name||"?").slice(0,1).toUpperCase())}</div><div class="nm"><b>${esc(a.name)}</b><div class="slug">?athlete=${esc(a.slug)}</div></div><div class="arrow">›</div></div>`;});
  h+=`</div>`;
  if(roster.length)h+=`<p class="muted" style="margin-left:4px">Tap an athlete to see their calendar, edit their program, or review logs. Their link is <code>…/index.html?athlete=SLUG</code>.</p>`;
  document.getElementById("app").innerHTML=h;
}
function newAthlete(){
  const cloneOpts=roster.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
  document.getElementById("app").innerHTML=`<div class="card"><div class="card-h"><h2>New athlete</h2></div><div class="card-b">
    <label class="fld"><span>Name</span><input class="in" id="nName" placeholder="e.g. Dad" oninput="if(!window.__slug)document.getElementById('nSlug').value=slugify(this.value)"></label>
    <label class="fld"><span>URL slug (used in their link)</span><input class="in" id="nSlug" placeholder="dad" oninput="window.__slug=true"></label>
    <label class="fld"><span>Start their program from…</span><select class="in" id="nClone"><option value="">Blank (build from scratch)</option>${cloneOpts}</select></label>
    <div class="row2" style="margin-top:12px"><button class="btn light" onclick="goRoster()">Cancel</button><button class="btn primary" onclick="createAthlete()">Create athlete</button></div>
  </div></div>`;
  window.__slug=false;
}
async function createAthlete(){
  const name=document.getElementById("nName").value.trim();
  let slug=slugify(document.getElementById("nSlug").value||name);
  const cloneId=document.getElementById("nClone").value;
  if(!name||!slug){toast("Name and slug are required",true);return;}
  if(roster.some(a=>a.slug===slug)){toast("That slug is taken",true);return;}
  let program={days:[]};
  if(cloneId){const src=roster.find(a=>a.id===cloneId);if(src)program=JSON.parse(JSON.stringify(src.program||{days:[]}));}
  try{const a=await DB.create({name,slug,program});toast("Athlete created ✓");roster=await DB.list();openAthlete(a.id);}catch(e){toast("Create failed: "+e.message.slice(0,60),true);}
}

async function openAthlete(id){
  document.getElementById("hCrumb").textContent="← All athletes";
  editing=JSON.parse(JSON.stringify(roster.find(a=>a.id===id)));
  if(!editing.program||!editing.program.days)editing.program={days:[]};
  if(!editing.overrides)editing.overrides={};
  editTab="calendar";selCalDate=null;calMonth=new Date();progMode="weekly";progDate=null;
  editing.__snap=JSON.stringify({p:editing.program,o:editing.overrides});
  document.getElementById("hCrumb").style.display="block";
  document.getElementById("hTitle").textContent=editing.name;
  try{athLogs=await DB.logs(editing.slug);}catch(e){athLogs=[];}
  renderEditor();
}
function renderEditor(){
  if(editing&&editing.isTemplate){
    document.getElementById("app").innerHTML=renderProgramEditor();
    document.getElementById("savebar").style.display="block";
    document.getElementById("saveHint").innerHTML=isDirty()?'<b style="color:#b3423a">⚠ Unsaved changes</b> — hit Save program to commit.':"Saving updates the template only — athletes change when you apply it to them.";
    return;
  }
  let h=`<div class="tabs">
    <div class="tab ${editTab==='calendar'?'on':''}" onclick="setTab('calendar')">Calendar</div>
    <div class="tab ${editTab==='program'?'on':''}" onclick="setTab('program')">Program</div>
    <div class="tab ${editTab==='logs'?'on':''}" onclick="setTab('logs')">Logs</div>
    <div class="tab ${editTab==='settings'?'on':''}" onclick="setTab('settings')">Settings</div></div>`;
  if(editTab==="calendar")h+=renderCalendar();
  else if(editTab==="program")h+=renderProgramEditor();
  else if(editTab==="logs")h+=`<div id="logsArea" class="card"><div class="card-b"><div class="muted">Loading…</div></div></div>`;
  else h+=renderSettings();
  document.getElementById("app").innerHTML=h;
  const dirty=isDirty();
  document.getElementById("savebar").style.display=(editTab==="program"||dirty)?"block":"none";
  document.getElementById("saveHint").innerHTML=dirty?'<b style="color:#b3423a">⚠ Unsaved changes</b> — hit Save program to commit, or Done to discard.':"Changes apply next time they open their page.";
  if(editTab==="logs")loadLogs();
}
function setTab(t){editTab=t;renderEditor();}

/* ---------------- CALENDAR ---------------- */
function logsByDate(){const m={};athLogs.forEach(l=>{(m[l.log_date]=m[l.log_date]||[]).push(l);});return m;}
function programForDow(dow){return (editing.program.days||[]).find(d=>d.dow===dow);}
function overrideFor(ds){const o=editing.overrides&&editing.overrides[ds];if(o&&(o.rest||(o.blocks&&o.blocks.length)||(o.focus&&o.focus.trim())))return o;return null;}
function editDateOverride(ds){editTab="program";progMode="date";progDate=ds;renderEditor();}
function renderCalendar(){
  const dirtyBanner=isDirty()?`<div class="card" style="border:1.5px solid #d9a03c;background:#fdf6e7"><div class="card-b" style="padding:10px 14px"><b>⚠ Previewing unsaved edits.</b> This calendar reflects changes you haven't saved yet — hit <b>Save program</b> to commit them, or they'll be discarded when you leave.</div></div>`:"";
  const y=calMonth.getFullYear(),mo=calMonth.getMonth();
  const monthName=calMonth.toLocaleString(undefined,{month:"long",year:"numeric"});
  const first=new Date(y,mo,1);const startCol=(first.getDay()+6)%7;const dim=new Date(y,mo+1,0).getDate();
  const lbd=logsByDate();const tISO=todayISO();
  let h=dirtyBanner+`<div class="card"><div class="card-b">
    <div class="cal-top">
      <button class="btn ghost sm" onclick="calNav(-1)">◀</button>
      <div class="mlabel">${esc(monthName)}</div>
      <button class="btn ghost sm" onclick="calNav(1)">▶</button>
      <button class="btn light sm" onclick="calToday()">Today</button>
      <span class="muted" style="margin-left:auto">Jump to <input type="date" class="in" style="width:auto;display:inline-block;padding:6px 8px" id="calJump" value="${selCalDate||tISO}" onchange="calJump(this.value)"></span>
    </div>
    <div class="calgrid">`;
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>h+=`<div class="calhead">${d}</div>`);
  for(let i=0;i<startCol;i++)h+=`<div class="calcell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(mo+1)}-${pad(d)}`;
    const dayLogs=lbd[ds];const past=ds<tISO;const isToday=ds===tISO;
    let cls="calcell",label="";
    if(dayLogs&&dayLogs.length){
      const isRest=dayLogs.some(l=>(l.day_focus||"").toLowerCase().includes("rest"))&&dayLogs.length===1;
      cls+=isRest?" rest":" done";label=isRest?"Rest":(dayLogs[0].day_focus||dayLogs[0].day_dow||"Logged");
    }else if(!past){
      const ov=overrideFor(ds);
      if(ov){if(ov.rest){cls+=" rest";label="★ Rest";}else{cls+=" custom";label="★ "+(ov.focus||"Custom");}}
      else{const pd=programForDow(DOW_OF[new Date(ds+"T00:00:00").getDay()]);
        if(pd){if(pd.rest){cls+=" rest";label="Rest";}else{cls+=" planned";label=pd.focus||"Planned";}}}
    }
    if(isToday)cls+=" today";if(ds===selCalDate)cls+=" sel";
    h+=`<div class="${cls}" onclick="selCal('${ds}')"><span class="dnum">${d}</span>${label?`<span class="tag2">${esc(label)}</span>`:""}</div>`;
  }
  h+=`</div>`;
  h+=`<div class="detail" id="calDetail">${selCalDate?renderCalDetail(selCalDate):'<div class="muted">Tap a day to see what was logged (past) or what is planned (upcoming).</div>'}</div>`;
  h+=`</div></div>`;
  return h;
}
function renderCalDetail(ds){
  const lbd=logsByDate();const dayLogs=lbd[ds];const past=ds<todayISO();
  const dObj=new Date(ds+"T00:00:00");const nice=dObj.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  if(dayLogs&&dayLogs.length){
    let h=`<h3>${esc(nice)} <span class="pill done">logged</span></h3>`;
    const byBlock={};dayLogs.forEach(l=>{(byBlock[l.block_title||"Workout"]=byBlock[l.block_title||"Workout"]||[]).push(l);});
    Object.keys(byBlock).forEach(bt=>{h+=`<div class="logday"><h4>${esc(bt)}</h4>`;byBlock[bt].forEach(l=>{const cardio=l.duration_min!=null||l.rpe!=null;h+=`<div class="logrow"><span class="lx">${esc(l.exercise_name)}</span><span class="v">${cardio?(esc(l.duration_min||"–")+" min"+(l.rpe!=null?", RPE "+esc(l.rpe):"")):(esc(l.reps||"–")+" reps"+(l.weight!=null?" @ "+esc(l.weight)+" lb":""))}</span>${l.note?`<span class="v">📝 ${esc(l.note)}</span>`:""}</div>`;});h+=`</div>`;});
    return h;
  }
  const ov=overrideFor(ds);
  if(ov){
    let h=`<h3>${esc(nice)} <span class="pill" style="background:#efe9f5;color:#6a4f8f">★ custom for this date</span></h3>`;
    if(ov.rest)h+=`<div class="muted">Rest day.</div>`;
    else{h+=`<div class="muted" style="margin-bottom:8px">${esc(ov.focus||"")}</div>`;(ov.blocks||[]).forEach(b=>{h+=`<div class="logday"><h4>${esc(b.title||b.tag||"Block")}</h4>`;(b.ex||[]).forEach(e=>{h+=`<div class="logrow"><span class="lx">${esc(e.name)}</span><span class="v">${esc(e.dose||"")}</span></div>`;});h+=`</div>`;});}
    h+=`<div style="margin-top:10px"><button class="btn light sm" onclick="editDateOverride('${ds}')">Edit this date</button></div>`;
    return h;
  }
  const pd=programForDow(DOW_OF[dObj.getDay()]);
  const addBtn=!past?`<div style="margin-top:10px"><button class="btn light sm" onclick="editDateOverride('${ds}')">★ Add a one-off for this date</button></div>`:"";
  if(!pd)return `<h3>${esc(nice)}</h3><div class="muted">${past?"Nothing was logged this day.":"No workout scheduled for this weekday."}</div>${addBtn}`;
  if(pd.rest)return `<h3>${esc(nice)} <span class="pill planned">${past?"":"planned"}</span></h3><div class="muted">Rest day.</div>${addBtn}`;
  let h=`<h3>${esc(nice)} <span class="pill ${past?'':'planned'}">${past?"not logged":"planned"}</span></h3><div class="muted" style="margin-bottom:8px">${esc(pd.focus||"")}</div>`;
  (pd.blocks||[]).forEach(b=>{h+=`<div class="logday"><h4>${esc(b.title||b.tag||"Block")}</h4>`;(b.ex||[]).forEach(e=>{h+=`<div class="logrow"><span class="lx">${esc(e.name)}</span><span class="v">${esc(e.dose||"")}</span></div>`;});h+=`</div>`;});
  return h+addBtn;
}
function calNav(dir){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+dir,1);renderEditor();}
function calToday(){calMonth=new Date();selCalDate=todayISO();renderEditor();}
function calJump(v){if(!v)return;selCalDate=v;calMonth=new Date(v+"T00:00:00");renderEditor();}
function selCal(ds){selCalDate=ds;document.getElementById("calDetail").innerHTML=renderCalDetail(ds);document.querySelectorAll(".calcell").forEach(c=>c.classList.remove("sel"));event&&event.currentTarget&&event.currentTarget.classList.add("sel");}

/* ---------------- PROGRAM EDITOR ---------------- */
function renderProgramEditor(){
  let h=`<div class="card"><div class="card-b">`;
  if(!editing.isTemplate){
    h+=`<div class="cal-top" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <button class="btn ${progMode==='weekly'?'primary':'light'} sm" onclick="setProgMode('weekly')">Weekly template</button>
      <span class="muted">— or a one-off for a specific date:</span>
      <input type="date" class="in" id="progDateInput" style="width:auto;padding:7px 9px" value="${progDate||todayISO()}" min="${todayISO()}" onchange="setProgDate(this.value)">
      <button class="btn ${progMode==='date'?'primary':'light'} sm" onclick="setProgDate(document.getElementById('progDateInput').value)">Edit this day →</button>
      ${progMode==='date'?`<span class="kindbadge" style="background:#efe9f5;color:#6a4f8f">editing ${esc(progDate||"")}</span>`:""}
    </div>`;
    if(progMode==='weekly')h+=`<div class="cal-top" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <button class="btn light sm" onclick="applyTplHere()">🗂 Load template…</button>
      <button class="btn light sm" onclick="saveAsTemplate()">★ Save week as template</button>
    </div>`;
  }
  if(progMode==='date'){h+=renderDateOverrideEditor();h+=`</div></div>`;return h;}
  editing.program.days.forEach((d,di)=>{
    h+=`<div class="day"><div class="day-h">
      <span class="dow">${esc(d.dow)}</span>
      <input class="in focusin" value="${esc(d.focus||"")}" placeholder="Focus (e.g. Strength A)" onchange="setDay(${di},'focus',this.value)">
      <input class="in" style="max-width:110px" value="${esc(d.badge||"")}" placeholder="Time" onchange="setDay(${di},'badge',this.value)">
      <label class="restbox" title="Mark this whole day as a rest day"><input type="checkbox" ${d.rest?"checked":""} onchange="setDay(${di},'rest',this.checked)">Rest day</label>
      <span class="ctrl"><span class="lbl">move</span><button class="btn ghost sm" title="Move day earlier" onclick="moveDay(${di},-1)">↑</button><button class="btn ghost sm" title="Move day later" onclick="moveDay(${di},1)">↓</button></span>
      <button class="btn danger sm" title="Delete this day" onclick="delDay(${di})">Delete day</button>
    </div><div class="day-b">`;
    h+=`<input class="in" style="margin-bottom:8px" value="${esc(d.note||"")}" placeholder="Day note (optional, shown to athlete)" onchange="setDay(${di},'note',this.value)">`;
    (d.blocks||[]).forEach((b,bi)=>{h+=renderBlockEditor(di,bi,b);});
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light sm" onclick="addBlock(${di})">+ Add block</button><button class="btn light sm" onclick="openAddGroup(${di})">🧩 Add group</button></div></div></div>`;
  });
  h+=`<button class="btn light" onclick="addDay()">+ Add day</button></div></div>`;
  return h;
}
function setProgMode(m){progMode=m;renderEditor();}
function setProgDate(v){if(!v)return;progDate=v;progMode="date";renderEditor();}
function renderDateOverrideEditor(){
  const date=progDate||todayISO();
  if(!editing.overrides)editing.overrides={};
  const existed=!!editing.overrides[date];
  if(!editing.overrides[date])editing.overrides[date]={focus:"",badge:"",blocks:[]};
  const d=editing.overrides[date];
  const dow=DOW_OF[new Date(date+"T00:00:00").getDay()];
  const weeklyDay=(editing.program.days||[]).find(x=>x.dow===dow);
  const nice=new Date(date+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  let h=`<div class="day" style="border-color:#cdbfe0"><div class="day-h" style="background:#efe9f5">
      <span class="dow" style="width:auto;color:#6a4f8f">${esc(nice)}</span>
      <input class="in focusin" value="${esc(d.focus||"")}" placeholder="Focus (e.g. 30-min run)" onchange="setDay(0,'focus',this.value)">
      <input class="in" style="max-width:110px" value="${esc(d.badge||"")}" placeholder="Time" onchange="setDay(0,'badge',this.value)">
      <label class="restbox" title="Make this date a rest day"><input type="checkbox" ${d.rest?"checked":""} onchange="setDay(0,'rest',this.checked)">Rest day</label>
      <button class="btn danger sm" title="Remove this date's custom plan (reverts to weekly)" onclick="removeOverride()">Remove one-off</button>
    </div><div class="day-b">
    <div class="muted" style="margin-bottom:8px">This replaces the weekly <b>${esc(fullDowName(dow))}</b> plan for <b>${esc(date)}</b> only.${(weeklyDay&&(!d.blocks||!d.blocks.length))?` · <a href="#" onclick="prefillOverride();return false;">Prefill from weekly ${esc(dow)}</a>`:""}</div>
    <input class="in" style="margin-bottom:8px" value="${esc(d.note||"")}" placeholder="Day note (optional)" onchange="setDay(0,'note',this.value)">`;
  (d.blocks||[]).forEach((b,bi)=>{h+=renderBlockEditor(0,bi,b);});
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light sm" onclick="addBlock(0)">+ Add block</button><button class="btn light sm" onclick="openAddGroup(0)">🧩 Add group</button></div>`;
  h+=`</div></div><p class="muted">Tip: build a 🧩 group once, then drop it here for the date you want.</p>`;
  return h;
}
function prefillOverride(){
  const date=progDate;const dow=DOW_OF[new Date(date+"T00:00:00").getDay()];const wd=(editing.program.days||[]).find(x=>x.dow===dow);
  if(!wd){toast("No weekly plan for that weekday",true);return;}
  editing.overrides[date]={focus:wd.focus||"",badge:wd.badge||"",rest:wd.rest||false,note:wd.note||"",blocks:JSON.parse(JSON.stringify(wd.blocks||[]))};
  renderEditor();toast("Prefilled from weekly "+dow);
}
function removeOverride(){
  if(editing.overrides)delete editing.overrides[progDate];
  progMode="weekly";renderEditor();toast("One-off removed — Save program to apply");
}
function renderBlockEditor(di,bi,b){
  let h=`<div class="blk" data-kind="${esc(b.kind||"strength")}"><div class="blk-top">
    <select class="in" style="max-width:120px" onchange="setBlk(${di},${bi},'kind',this.value)">${KINDS.map(k=>`<option value="${k}" ${b.kind===k?"selected":""}>${k}</option>`).join("")}</select>
    <input class="in" value="${esc(b.title||"")}" placeholder="Block title" onchange="setBlk(${di},${bi},'title',this.value)">
    <button class="btn ghost sm" title="Move block up" onclick="moveBlk(${di},${bi},-1)">↑</button>
    <button class="btn ghost sm" title="Move block down" onclick="moveBlk(${di},${bi},1)">↓</button>
    <button class="btn danger sm" title="Delete block" onclick="delBlk(${di},${bi})">✕</button></div>
    <div class="row2"><input class="in" value="${esc(b.tag||"")}" placeholder="Tag (e.g. Strength)" onchange="setBlk(${di},${bi},'tag',this.value)">
    <input class="in" value="${esc(b.sub||"")}" placeholder="Subtitle" onchange="setBlk(${di},${bi},'sub',this.value)"></div>
    <input class="in" style="margin-top:7px" value="${esc(b.note||"")}" placeholder="Block note (optional)" onchange="setBlk(${di},${bi},'note',this.value)">`;
  (b.ex||[]).forEach((e,ei)=>{h+=renderExEditor(di,bi,ei,e);});
  h+=`<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" onclick="openExPicker(${di},${bi})">+ Add from library</button><button class="btn light sm" onclick="addBlankEx(${di},${bi})">+ Blank exercise</button></div></div>`;
  return h;
}
function renderExEditor(di,bi,ei,e){
  return `<div class="ex"><div class="reorder"><button title="Move up" onclick="moveEx(${di},${bi},${ei},-1)">▲</button><button title="Move down" onclick="moveEx(${di},${bi},${ei},1)">▼</button></div>
    <div class="grow"><div class="row2">
      <input class="in" value="${esc(e.name||"")}" placeholder="Exercise name" onchange="setEx(${di},${bi},${ei},'name',this.value)">
      <input class="in" style="max-width:130px" value="${esc(e.dose||"")}" placeholder="Sets×reps / dose" onchange="setEx(${di},${bi},${ei},'dose',this.value)"></div>
      <input class="in" style="margin-top:6px" value="${esc(e.cue||"")}" placeholder="Form cue (shown to athlete)" onchange="setEx(${di},${bi},${ei},'cue',this.value)">
      <input class="in" style="margin-top:6px" value="${esc(e.coachNote||"")}" placeholder="Coach note (your guidance)" onchange="setEx(${di},${bi},${ei},'coachNote',this.value)"></div>
    <div style="display:flex;flex-direction:column;gap:5px"><button class="btn ghost sm" title="Save to library" onclick="exToLibrary(${di},${bi},${ei})">★</button><button class="btn danger sm" onclick="delEx(${di},${bi},${ei})">✕</button></div></div>`;
}
function setDay(di,f,v){curDays()[di][f]=v;}
function setBlk(di,bi,f,v){curDays()[di].blocks[bi][f]=v;if(f==="kind")renderEditor();}
function setEx(di,bi,ei,f,v){curDays()[di].blocks[bi].ex[ei][f]=v;}
function addDay(){const used=editing.program.days.map(d=>d.dow);const next=DOWS.find(d=>!used.includes(d))||"Day";editing.program.days.push({dow:next,focus:"",badge:"",blocks:[]});renderEditor();}
function delDay(di){if(!confirm("Delete this whole day?"))return;editing.program.days.splice(di,1);renderEditor();}
function moveDay(di,dir){const a=editing.program.days,j=di+dir;if(j<0||j>=a.length)return;[a[di],a[j]]=[a[j],a[di]];renderEditor();}
function addBlock(di){const day=curDays()[di];day.rest=false;(day.blocks=day.blocks||[]).push({kind:"strength",tag:"Strength",title:"New block",sub:"",ex:[]});renderEditor();}
function delBlk(di,bi){curDays()[di].blocks.splice(bi,1);renderEditor();}
function moveBlk(di,bi,dir){const a=curDays()[di].blocks,j=bi+dir;if(j<0||j>=a.length)return;[a[bi],a[j]]=[a[j],a[bi]];renderEditor();}
function addBlankEx(di,bi){const day=curDays()[di];day.rest=false;const b=day.blocks[bi];(b.ex=b.ex||[]).push({name:"",dose:"",cue:"",coachNote:""});renderEditor();}
function delEx(di,bi,ei){curDays()[di].blocks[bi].ex.splice(ei,1);renderEditor();}
function moveEx(di,bi,ei,dir){const a=curDays()[di].blocks[bi].ex,j=ei+dir;if(j<0||j>=a.length)return;[a[ei],a[j]]=[a[j],a[ei]];renderEditor();}
async function exToLibrary(di,bi,ei){
  const e=curDays()[di].blocks[bi].ex[ei];const kind=curDays()[di].blocks[bi].kind||"strength";
  if(!e.name||!e.name.trim()){toast("Give the exercise a name first",true);return;}
  try{await DB.libCreate({name:e.name.trim(),kind,dose:e.dose||null,cue:e.cue||null,note:e.coachNote||null});library=[];toast("Saved to library ★");}
  catch(e2){toast(/duplicate|unique/i.test(e2.message)?"Already in library":"Save failed",true);}
}
function cleanOverrides(){
  if(!editing.overrides)return;
  Object.keys(editing.overrides).forEach(k=>{const o=editing.overrides[k];
    const empty=!o.rest&&!(o.blocks&&o.blocks.length)&&!(o.focus&&o.focus.trim())&&!(o.note&&o.note.trim());
    if(empty)delete editing.overrides[k];});
}
async function saveProgram(){
  const btn=document.getElementById("saveProgBtn");btn.disabled=true;btn.textContent="Saving…";
  if(editing&&editing.isTemplate){

      <option value="range">Specific dates only (start → end)</option>

    </select></label>
    <div id="apRange"><div class="row2">

    <p class="muted" id="apWeeklyNote" style="display:none">This replaces their current weekly program immediately and repeats every week until you change it. Their logs and one-off date plans are untouched.</p>
    <div class="row2" style="margin-top:12px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyTplToAthlete('${t.id}')">Apply</button></div>
  </div></div></div>`;

async function applyTplToAthlete(tplId){
  const t=templates.find(x=>x.id===tplId);const aid=document.getElementById("apAth").value;const a=roster.find(x=>x.id===aid);
  if(!t||!a)return;
  const mode=document.getElementById("apMode").value;
  if(mode==="weekly"){
    try{await DB.update(a.id,{program:JSON.parse(JSON.stringify(t.program||{days:[]}))});roster=await DB.list();closeModal();toast(`Weekly plan applied to ${a.name} ✓`);}
    catch(e){toast("Apply failed: "+e.message.slice(0,60),true);}
    return;
  }
  const s=document.getElementById("apStart").value, en=document.getElementById("apEnd").value;
  if(!s||!en||s>en){toast("Pick a valid start and end date",true);return;}
  if((new Date(en+"T00:00:00")-new Date(s+"T00:00:00"))/864e5>92){toast("Range too long — 92 days max",true);return;}
  const ov=JSON.parse(JSON.stringify(a.overrides||{}));
  let n=0;
  for(let d=new Date(s+"T00:00:00");iso(d)<=en;d.setDate(d.getDate()+1)){
    const dow=DOW_OF[d.getDay()];
    const day=(t.program.days||[]).find(x=>x.dow===dow);
    if(!day)continue;
    const copy=JSON.parse(JSON.stringify(day));delete copy.dow;
    ov[iso(d)]=copy;n++;
  }
  if(!n){toast("Template has no weekdays matching that range",true);return;}
  try{await DB.update(a.id,{overrides:ov});roster=await DB.list();closeModal();toast(`Planned ${n} day(s) for ${a.name} ✓`);}
  catch(e){toast("Apply failed: "+e.message.slice(0,60),true);}
}

  const items=library.filter(e=>(!ql||(e.name||"").toLowerCase().includes(ql))&&(!gPickKind||e.kind===gPickKind)&&(!cat||e.category===cat));
  const cats=libCategories();
  let h=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Add to group</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="modal-b">
    <input class="in" id="grpPickerSearch" placeholder="Search…" value="${esc(q||"")}" oninput="grpPickerSearchInput(this,'${esc(cat||"")}')" style="margin-bottom:8px">
    <div class="row2" style="margin-bottom:10px">
      <select class="in" onchange="gPickKind=this.value;renderGroupPicker('${esc(q||"")}','${esc(cat||"")}')"><option value="">All kinds</option>${KINDS.map(k=>`<option ${gPickKind===k?"selected":""}>${k}</option>`).join("")}</select>
      <select class="in" onchange="renderGroupPicker('${esc(q||"")}',this.value)"><option value="">All categories</option>${cats.map(c=>`<option ${cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`;
  if(!items.length)h+=`<div class="muted">No matches.</div>`;
  items.forEach(e=>{h+=`<div class="libitem" onclick='gPick(${JSON.stringify(e).replace(/'/g,"&#39;")})'><div class="li-nm"><b>${esc(e.name)}</b>${e.dose?` <span class="muted">· ${esc(e.dose)}</span>`:""}</div>${e.category?`<span class="kindbadge" style="background:#efe9f5;color:#6a4f8f">${esc(e.category)}</span>`:""}<span class="kindbadge ${esc(e.kind||"strength")}">${esc(e.kind||"")}</span></div>`;});
  h+=`</div></div></div>`;document.getElementById("modalRoot").innerHTML=h;
}
function gPick(e){editingGroup.items.push({name:e.name||"",dose:e.dose||"",cue:e.cue||"",coachNote:e.note||""});closeModal();renderGroupEditor();}
async function saveGroup(){
  const g=editingGroup;if(!g.name||!g.name.trim()){toast("Give the group a name",true);return;}
  const rec={name:g.name.trim(),kind:g.kind||"strength",tag:g.tag||null,items:g.items||[]};
  try{if(g.id)await DB.grpUpdate(g.id,rec);else await DB.grpCreate(rec);groups=await DB.grpList();toast("Group saved ✓");openGroups();}
  catch(e){toast("Save failed: "+e.message.slice(0,60),true);}
}
async function grpDelete(id){if(!confirm("Delete this group?"))return;try{await DB.grpRemove(id);groups=groups.filter(g=>g.id!==id);renderGroupsScreen();toast("Deleted");}catch(e){toast("Delete failed",true);}}

/* add a saved group to one or more weekdays of the current athlete's program */
async function openAddGroup(di){
  if(!groups.length){try{groups=await DB.grpList();}catch(e){groups=[];}}
  if(progMode==='date'){agSel={groupId:(groups[0]?groups[0].id:null),dows:[],dateMode:true};renderAddGroup();return;}
  const curDow=editing.program.days[di]?editing.program.days[di].dow:"Mon";
  agSel={groupId:(groups[0]?groups[0].id:null),dows:[curDow]};
  renderAddGroup();
}
function renderAddGroup(){
  let h=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Add a saved group</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="modal-b">`;
  if(!groups.length)h+=`<div class="muted">No groups saved yet. Create one from the roster screen → 🧩 Groups.</div>`;
  else{
    h+=`<div class="muted" style="margin-bottom:6px">Choose a group</div>`;
    groups.forEach(g=>{h+=`<div class="libitem" onclick="agSel.groupId='${g.id}';renderAddGroup()" style="${agSel.groupId===g.id?'border-color:var(--navy);box-shadow:0 0 0 1.5px var(--navy) inset':''}"><div class="li-nm"><b>${esc(g.name)}</b> <span class="muted">· ${(g.items||[]).length} ex</span></div><span class="kindbadge ${esc(g.kind||'strength')}">${esc(g.kind||'')}</span></div>`;});
    if(agSel.dateMode){
      h+=`<div class="row2" style="margin-top:14px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyAddGroupDate()">Add to ${esc(progDate||"")}</button></div>`;
    }else{
      h+=`<div class="muted" style="margin:12px 0 6px">Add to which days? (repeats every week)</div><div class="row2" style="flex-wrap:wrap">`;
      DOWS.forEach(d=>{const on=agSel.dows.includes(d);h+=`<button class="btn ${on?'primary':'light'} sm" style="min-width:60px" onclick="toggleAgDow('${d}')">${d}</button>`;});
      h+=`</div><div class="row2" style="margin-top:14px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyAddGroup()">Add to ${agSel.dows.length} day${agSel.dows.length!==1?'s':''}</button></div>`;
    }
  }
  h+=`</div></div></div>`;document.getElementById("modalRoot").innerHTML=h;
}
function applyAddGroupDate(){
  const g=groups.find(x=>x.id===agSel.groupId);if(!g){toast("Pick a group",true);return;}
  const D=curDays();D[0].rest=false;(D[0].blocks=D[0].blocks||[]).push({kind:g.kind||"strength",tag:g.tag||g.kind||"",title:g.name,sub:"",ex:JSON.parse(JSON.stringify(g.items||[]))});
  closeModal();renderEditor();toast(`Added “${g.name}” to ${progDate}`);
}
function toggleAgDow(d){const i=agSel.dows.indexOf(d);if(i>=0)agSel.dows.splice(i,1);else agSel.dows.push(d);renderAddGroup();}
function applyAddGroup(){
  const g=groups.find(x=>x.id===agSel.groupId);if(!g){toast("Pick a group",true);return;}
  if(!agSel.dows.length){toast("Pick at least one day",true);return;}
  agSel.dows.forEach(dow=>{
    let day=editing.program.days.find(d=>d.dow===dow);
    if(!day){day={dow,focus:g.name,badge:"",blocks:[]};editing.program.days.push(day);}
    day.rest=false;day.blocks=day.blocks||[];
    day.blocks.push({kind:g.kind||"strength",tag:g.tag||g.kind||"",title:g.name,sub:"",ex:JSON.parse(JSON.stringify(g.items||[]))});
  });
  editing.program.days.sort((a,b)=>{const ia=DOWS.indexOf(a.dow),ib=DOWS.indexOf(b.dow);return (ia<0?99:ia)-(ib<0?99:ib);});
  const n=agSel.dows.length;closeModal();renderEditor();toast(`Added “${g.name}” to ${n} day${n!==1?"s":""} — remember to Save program`);
}

/* ---------------- LOGS + SETTINGS ---------------- */
async function loadLogs(){
  try{athLogs=await DB.logs(editing.slug);}catch(e){}
  const area=document.getElementById("logsArea");if(!area)return;
  if(!athLogs.length){area.innerHTML=`<div class="empty"><div class="big">No logs yet</div>${esc(editing.name)} hasn't recorded any workouts.</div>`;return;}
  const byDate={};athLogs.forEach(l=>{(byDate[l.log_date]=byDate[l.log_date]||[]).push(l);});
  let h=`<div class="card-b">`;
  Object.keys(byDate).sort().reverse().forEach(date=>{const rows=byDate[date];
    h+=`<div class="logday"><h4>${esc(date)} <span class="muted" style="font-weight:400">${esc(rows[0].day_focus||"")}</span></h4>`;
    rows.forEach(l=>{const cardio=l.duration_min!=null||l.rpe!=null||l.distance!=null;h+=`<div class="logrow"><span class="lx">${esc(l.exercise_name)} <span class="v">· set ${l.set_number}</span></span><span class="v">${cardio?([l.duration_min!=null?esc(l.duration_min)+" min":null,l.distance!=null?esc(l.distance)+" "+esc(l.distance_unit||"mi"):null,l.rpe!=null?"RPE "+esc(l.rpe):null].filter(Boolean).join(", ")||"–"):(esc(l.reps||"–")+" reps"+(l.weight!=null?" @ "+esc(l.weight)+" lb":""))}</span>${l.note?`<span class="v">📝 ${esc(l.note)}</span>`:""}<button class="btn danger sm" onclick="delLog('${l.id}')">🗑</button></div>`;});
    h+=`</div>`;});
  h+=`</div>`;area.innerHTML=h;
}
async function delLog(id){if(!confirm("Delete this log entry?"))return;try{await DB.delLog(id);athLogs=athLogs.filter(l=>l.id!==id);loadLogs();toast("Deleted");}catch(e){toast("Delete failed",true);}}
function renderSettings(){
  return `<div class="card"><div class="card-b">
    <label class="fld"><span>Name</span><input class="in" value="${esc(editing.name)}" onchange="editing.name=this.value;document.getElementById('hTitle').textContent=this.value"></label>
    <label class="fld"><span>URL slug</span><input class="in" value="${esc(editing.slug)}" onchange="editing.slug=slugify(this.value);this.value=editing.slug"></label>
    <p class="muted">Their page: <code>…/index.html?athlete=${esc(editing.slug)}</code></p>
    <div class="row2" style="margin-top:10px"><button class="btn light" onclick="saveSettings()">Save details</button><button class="btn danger" onclick="deleteAthlete()">Delete athlete</button></div>
  </div></div>`;
}
async function saveSettings(){try{await DB.update(editing.id,{name:editing.name,slug:editing.slug});toast("Saved ✓");roster=await DB.list();}catch(e){toast("Save failed",true);}}
async function deleteAthlete(){if(!confirm("Delete "+editing.name+" and all their data? This cannot be undone."))return;try{await DB.remove(editing.id);toast("Deleted");goRoster();}catch(e){toast("Delete failed",true);}}

document.getElementById("saveProgBtn").onclick=saveProgram;
start();
</script>
