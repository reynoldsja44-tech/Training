<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16324f">
<title>Coach · Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4f1ea;--card:#fffdf9;--ink:#22303c;--muted:#6b7884;--line:#e0d9c9;--navy:#16324f;
    --strength:#3b6ea5;--cardio:#2f8f86;--accessory:#6a9a5b;--core:#c2754e;--mobility:#7b6aa8;--ok:#2f8f86;--red:#a85a5a;--extra:#8a6fb0;
    --shadow:0 1px 3px rgba(40,50,60,.06),0 5px 18px rgba(40,50,60,.07);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:80px;}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px;}
  header{background:linear-gradient(180deg,#16324f,#1c3e60);color:#f7f3ea;padding:20px 18px;box-shadow:var(--shadow);}
  header .inner{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  header h1{font-family:"Fraunces",serif;font-weight:600;font-size:22px;margin:0;flex:1;}
  header .crumb{font-size:13px;opacity:.85;cursor:pointer;}
  header .crumb:hover{text-decoration:underline;}
  .btn{border:none;border-radius:11px;padding:10px 15px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.light{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  .btn.danger{background:transparent;color:var(--red);border:1.5px solid #e0bdbd;}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:9px;}
  .btn:active{transform:scale(.98);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden;}
  .card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .card-h h2{font-size:17px;margin:0;flex:1;font-weight:700;}
  .card-b{padding:14px 16px;}

  .roster-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #f0ebdf;cursor:pointer;}
  .roster-row:hover{background:#f7f3ea;}
  .roster-row:first-child{border-top:none;}
  .avatar{width:40px;height:40px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;}
  .roster-row .nm{flex:1;}.roster-row .nm b{font-size:16.5px;}
  .roster-row .nm .slug{font-size:13px;color:var(--muted);font-family:ui-monospace,monospace;}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
  .tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--line,#eee);text-align:left;}
  .tbl tr.dim{opacity:.45;}
  .roster-row .arrow{color:var(--muted);}

  label.fld{display:block;margin:9px 0;}
  label.fld span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:3px;}
  input.in,textarea.in,select.in{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);}
  input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--strength);}
  textarea.in{resize:vertical;min-height:40px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}.row2>*{flex:1;min-width:140px;}

  .tabs{display:flex;gap:6px;margin:6px 0 0;flex-wrap:wrap;}
  .tab{padding:9px 15px;border-radius:11px 11px 0 0;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--muted);border:1.5px solid transparent;border-bottom:none;}
  .tab.on{background:var(--card);color:var(--ink);border-color:var(--line);}

  .day{border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden;background:#fffefb;}
  .day-h{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#f1ece1;flex-wrap:wrap;}
  .day-h .dow{font-family:"Fraunces",serif;font-weight:600;font-size:18px;width:46px;}
  .day-h input.focusin{flex:1;min-width:130px;}
  .ctrl{display:flex;align-items:center;gap:3px;}
  .ctrl .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .restbox{display:flex;gap:5px;align-items:center;white-space:nowrap;font-size:13px;color:var(--muted);font-weight:700;border:1.5px solid var(--line);border-radius:9px;padding:5px 9px;background:#fff;}
  .day-b{padding:11px 13px;}
  .blk{border:1px solid var(--line);border-left:5px solid var(--strength);border-radius:0 11px 11px 0;margin:10px 0;padding:11px;background:#fff;}
  .blk[data-kind="cardio"]{border-left-color:var(--cardio);}
  .blk[data-kind="accessory"]{border-left-color:var(--accessory);}.blk[data-kind="mobility"]{border-left-color:var(--mobility);}
  .blk[data-kind="core"]{border-left-color:var(--core);}
  .blk-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .ex{display:flex;gap:7px;align-items:flex-start;padding:8px;border:1px solid #eee4d2;border-radius:10px;margin:7px 0;background:#fffdf8;flex-wrap:wrap;}
  .ex .grow{flex:1;min-width:160px;}
  .ex .reorder{display:flex;flex-direction:column;gap:2px;}
  .ex .reorder button{border:none;background:#eee;border-radius:5px;width:24px;height:20px;cursor:pointer;font-size:11px;line-height:1;color:#555;}
  .muted{color:var(--muted);font-size:13px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:120;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#9a3b3b;}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,241,234,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 18px;}
  .savebar .inner{max-width:940px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:flex-end;}

  /* calendar */
  .cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .cal-top .mlabel{font-family:"Fraunces",serif;font-size:19px;font-weight:600;min-width:160px;text-align:center;}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .calhead{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:2px 0;}
  .calcell{min-height:64px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
  .calcell.empty{background:transparent;border:none;cursor:default;}
  .calcell .dnum{font-size:12px;color:var(--muted);font-weight:700;}
  .calcell.today{border-color:var(--cardio);box-shadow:0 0 0 1.5px var(--cardio) inset;}
  .calcell.sel{box-shadow:0 0 0 2px var(--navy) inset;border-color:var(--navy);}
  .calcell .tag2{font-size:11px;line-height:1.2;border-radius:6px;padding:2px 4px;font-weight:600;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
  @media(max-width:520px){
    .calgrid{gap:3px;}
    .calcell{min-height:56px;padding:3px 4px;border-radius:7px;}
    .calcell .tag2{font-size:9.5px;padding:1px 3px;-webkit-line-clamp:4;}
    .cal-top .mlabel{min-width:110px;font-size:16px;}
    .wrap{padding:0 10px;}
  }
  .calcell.done .tag2{background:#e3f2ee;color:#1f6f63;}
  .calcell.planned .tag2{background:#eef2f8;color:#3b6ea5;}
  .calcell.rest .tag2{background:#f0ece2;color:#8a7a55;}
  .calcell.custom{border-color:#cdbfe0;}
  .calcell.custom .tag2{background:#efe9f5;color:#6a4f8f;}
  .detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .detail h3{font-family:"Fraunces",serif;font-size:18px;margin:0 0 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;margin-left:6px;}
  .pill.done{background:#e3f2ee;color:#1f6f63;}.pill.planned{background:#eef2f8;color:#3b6ea5;}

  .logday{border:1px solid var(--line);border-radius:12px;margin:11px 0;overflow:hidden;}
  .logday h4{margin:0;padding:10px 13px;background:#f1ece1;font-size:15px;}
  .logrow{display:flex;gap:9px;align-items:center;padding:8px 13px;border-top:1px solid #f0ebdf;font-size:14px;flex-wrap:wrap;}
  .logrow .lx{flex:1;min-width:140px;font-weight:600;}.logrow .v{color:var(--muted);}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);}
  .empty .big{font-family:"Fraunces",serif;font-size:22px;color:var(--ink);margin-bottom:6px;}
  code{background:#eee4d2;padding:1px 6px;border-radius:5px;font-size:13px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,28,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto;}
  .modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden;}
  .modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .modal-h h3{margin:0;flex:1;font-size:17px;}
  .modal-b{padding:14px 16px;max-height:60vh;overflow:auto;}
  .libitem{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer;background:#fff;}
  .libitem:hover{background:#f7f3ea;}
  .libitem .li-nm{flex:1;}.libitem .li-nm b{font-size:15px;}
  .kindbadge{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:2px 6px;}
  .kindbadge.strength{background:#eaf1f8;color:#3b6ea5;}.kindbadge.cardio{background:#e3f2f0;color:#2f8f86;}
  .kindbadge.accessory{background:#eef4ea;color:#4f7a42;}.kindbadge.core{background:#f8ece4;color:#c2754e;}.kindbadge.mobility{background:#efeaf5;color:#6a4f8f;}
</style>
</head>
<body>
<header><div class="inner">
  <h1 id="hTitle">Coach Dashboard</h1>
  <span class="crumb" id="hCrumb" onclick="doneEditing()" style="display:none">← All athletes</span>
</div></header>

<div class="wrap"><div id="app"></div></div>
<div class="savebar" id="savebar" style="display:none"><div class="inner">
  <span class="muted" id="saveHint"></span>
  <button class="btn light" onclick="doneEditing()">Done</button>
  <button class="btn primary" id="saveProgBtn">Save program</button>
</div></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://rkuwuuwkymetibzfmilk.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdXd1dXdreW1ldGliemZtaWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTQ5MjcsImV4cCI6MjA5NjUzMDkyN30.k7YOMavSufOZC3d7gm2vX9KXXHfBPOQqtD0cms64WX8";
const REST=SB_URL+"/rest/v1";
const DEMO=new URLSearchParams(location.search).get("demo")==="1";

/* ---------------- AUTH (coach login) ---------------- */
const AUTH={
  key:"coach_session",
  get session(){try{return JSON.parse(localStorage.getItem(this.key));}catch(e){return null;}},
  set session(s){s?localStorage.setItem(this.key,JSON.stringify(s)):localStorage.removeItem(this.key);},
  valid(){const s=this.session;return !!(s&&s.access_token&&s.expires_at>Date.now()+30000);},
  async login(email,pw){
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error_description||d.msg||"Login failed");
    this.session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,email};
  },
  async refresh(){
    const s=this.session;if(!s||!s.refresh_token)return false;
    try{
      const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
      const d=await r.json();
      if(!r.ok)throw 0;
      this.session={access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,email:s.email};
      return true;
    }catch(e){return false;}
  },
  async ensureFresh(){
    const s=this.session;if(!s)return false;
    if(s.expires_at>Date.now()+120000)return true;
    return await this.refresh();
  },
  logout(){this.session=null;location.reload();}
};
function H(){
  const s=AUTH.session;
  return {apikey:SB_KEY,Authorization:"Bearer "+((s&&s.access_token)||SB_KEY)};
}
async function sfetch(url,opts){
  if(!DEMO)await AUTH.ensureFresh();
  let r=await fetch(url,opts?{...opts,headers:{...(opts.headers||{}),...H()}}:{headers:H()});
  if(r.status===401&&!DEMO&&await AUTH.refresh()){
    r=await fetch(url,opts?{...opts,headers:{...(opts.headers||{}),...H()}}:{headers:H()});
  }
  if(r.status===401&&!DEMO){AUTH.session=null;renderLogin("Your session expired — sign in again.");throw new Error("Signed out");}
  return r;
}
const realDB={
  async list(){const r=await sfetch(`${REST}/athletes?select=*&order=name`,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json();},
  async create(a){const r=await sfetch(`${REST}/athletes`,{method:"POST",headers:{...H(),"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(a)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0];},
  async update(id,patch){const r=await sfetch(`${REST}/athletes?id=eq.${id}`,{method:"PATCH",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());},
  async remove(id){const r=await sfetch(`${REST}/athletes?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw new Error(await r.text());},
  async logs(slug){const r=await sfetch(`${REST}/logs?athlete_slug=eq.${encodeURIComponent(slug)}&order=log_date.desc,created_at.desc`,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json();},
  async delLog(id){const r=await sfetch(`${REST}/logs?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw new Error(await r.text());},
  async libList(){const r=await sfetch(`${REST}/exercises?select=*&order=kind,name`,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json();},
  async libCreate(e){const r=await sfetch(`${REST}/exercises`,{method:"POST",headers:{...H(),"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(e)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0];},
  async libUpdate(id,patch){const r=await sfetch(`${REST}/exercises?id=eq.${id}`,{method:"PATCH",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());},
  async libRemove(id){const r=await sfetch(`${REST}/exercises?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw new Error(await r.text());},
  async grpList(){const r=await sfetch(`${REST}/groups?select=*&order=name`,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json();},
  async grpCreate(g){const r=await sfetch(`${REST}/groups`,{method:"POST",headers:{...H(),"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(g)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0];},
  async grpUpdate(id,patch){const r=await sfetch(`${REST}/groups?id=eq.${id}`,{method:"PATCH",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());},
  async grpRemove(id){const r=await sfetch(`${REST}/groups?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw new Error(await r.text());},
  async tplList(){const r=await sfetch(`${REST}/templates?select=*&order=name`,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json();},
  async tplCreate(t){const r=await sfetch(`${REST}/templates`,{method:"POST",headers:{...H(),"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(t)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0];},
  async tplUpdate(id,patch){const r=await sfetch(`${REST}/templates?id=eq.${id}`,{method:"PATCH",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify({...patch,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text());},
  async tplRemove(id){const r=await sfetch(`${REST}/templates?id=eq.${id}`,{method:"DELETE",headers:H()});if(!r.ok)throw new Error(await r.text());}
};
const DEMO_PROG={days:[
  {dow:"Mon",focus:"Strength A + Arms",badge:"55–60 min",blocks:[{kind:"strength",tag:"Strength",title:"Strength A — legs + push",sub:"cable + dumbbells",ex:[{name:"Goblet squat to box (DB)",dose:"3 × 8–10",cue:"Heels down",coachNote:"Start light."},{name:"Cable biceps curl",dose:"2 × 12",cue:"Elbows pinned"}]}]},
  {dow:"Tue",focus:"Cardio (Zone 2)",badge:"55 min",blocks:[{kind:"cardio",tag:"Cardio",title:"Zone 2",sub:"25–40 min",note:"Conversational pace.",ex:[{name:"Zone 2 session",dose:"25–40 min",cue:""}]}]},
  {dow:"Sun",focus:"Rest",badge:"—",rest:true,blocks:[{kind:"accessory",tag:"Optional",title:"Rest",sub:"",note:"Recover.",ex:[]}]}]};
function makeMock(){
  let aths=[{id:"m1",slug:"mom",name:"Mom (82)",program:JSON.parse(JSON.stringify(DEMO_PROG)),overrides:{}}];
  let today=new Date();function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
  let y=iso(new Date(today.getTime()-2*864e5));
  let logs=[{id:"l1",athlete_slug:"mom",log_date:y,day_dow:"Mon",day_focus:"Strength A + Arms",exercise_name:"Goblet squat to box (DB)",set_number:1,reps:"10",weight:25,note:"Felt good"},
            {id:"l2",athlete_slug:"mom",log_date:y,day_dow:"Mon",day_focus:"Strength A + Arms",exercise_name:"Goblet squat to box (DB)",set_number:2,reps:"9",weight:25,note:null}];
  let lib=[{id:"e1",name:"Goblet squat to box (DB)",kind:"strength",dose:"3 × 8–10",cue:"Heels down",category:"accessory"},
           {id:"e2",name:"Standing cable chest press",kind:"strength",dose:"3 × 10–12",cue:"Staggered stance",category:"accessory"},
           {id:"e3",name:"Zone 2 session",kind:"cardio",dose:"25–40 min",cue:"Talk-test pace",category:null},
           {id:"e4",name:"Dead bug",kind:"core",dose:"3 × 8 / side",cue:"Low back flat",category:"accessory"},
           {id:"e5",name:"Thruster",kind:"strength",dose:"",cue:"Front squat into press",category:"crossfit"},
           {id:"e6",name:"Wall ball",kind:"cardio",dose:"",cue:"Throw to target",category:"crossfit"},
           {id:"e7",name:"Sled Push",kind:"strength",dose:"50 m",cue:"Stay low",category:"hyrox"}];
  let grps=[{id:"g1",name:"Lower body strength",kind:"strength",tag:"Strength",items:[{name:"Goblet squat to box (DB)",dose:"3 × 8–10",cue:"Heels down",coachNote:""},{name:"Sled Push",dose:"4 × 20 m",cue:"Stay low",coachNote:""}]}];
  let tpls=[];
  let n=1;
  return {async list(){return JSON.parse(JSON.stringify(aths));},
    async create(a){const x={...a,id:"m"+(++n+1)};aths.push(x);return x;},
    async update(id,patch){const a=aths.find(x=>x.id===id);if(a)Object.assign(a,patch);},
    async remove(id){aths=aths.filter(x=>x.id!==id);},
    async logs(slug){return JSON.parse(JSON.stringify(logs.filter(l=>l.athlete_slug===slug)));},
    async delLog(id){logs=logs.filter(l=>l.id!==id);},
    async libList(){return JSON.parse(JSON.stringify(lib));},
    async libCreate(e){const x={...e,id:"e"+(++n+10)};lib.push(x);return x;},
    async libUpdate(id,patch){const e=lib.find(x=>x.id===id);if(e)Object.assign(e,patch);},
    async libRemove(id){lib=lib.filter(x=>x.id!==id);},
    async grpList(){return JSON.parse(JSON.stringify(grps));},
    async grpCreate(g){const x={...g,id:"g"+(++n+20)};grps.push(x);return x;},
    async grpUpdate(id,patch){const g=grps.find(x=>x.id===id);if(g)Object.assign(g,patch);},
    async grpRemove(id){grps=grps.filter(x=>x.id!==id);},
    async tplList(){return JSON.parse(JSON.stringify(tpls));},

/* ---------- Multi-metric prescription ----------
   Sets + any of reps / weight / time / distance / cal (e.metrics = enabled list).
   Values: reps, weight, time(+timeUnit), dist(+distUnit), cal. detail = freeform.
   A derived `dose` string is kept for the athlete view + backward compat. Legacy
   entries are auto-parsed from `dose` on first edit. */
const TIME_UNITS=["sec","min"], DIST_UNITS=["m","km","mi","yd"];
const METRIC_ORDER=["reps","weight","time","distance","cal"];
const METRIC_LABEL={reps:"Reps",weight:"Weight",time:"Time",distance:"Dist",cal:"Cal"};
function canonMetrics(a){return METRIC_ORDER.filter(m=>Array.isArray(a)&&a.includes(m));}
function hasM(e,m){return Array.isArray(e.metrics)&&e.metrics.includes(m);}
function ne(v){return v!=null&&(""+v).trim()!=="";}
function deriveDose(e){
  const q=[];
  if(hasM(e,"reps")&&ne(e.reps))q.push((""+e.reps).trim());
  if(hasM(e,"time")&&ne(e.time))q.push((""+e.time).trim()+" "+(e.timeUnit||"sec"));
  if(hasM(e,"distance")&&ne(e.dist))q.push((""+e.dist).trim()+" "+(e.distUnit||"m"));
  if(hasM(e,"cal")&&ne(e.cal))q.push((""+e.cal).trim()+" cal");
  let core=q.join(" / ");
  const sets=(e.sets==null?"":(""+e.sets)).trim();
  if(sets&&core)core=sets+" × "+core; else if(sets&&!core)core=sets+" ×";
  if(hasM(e,"weight")&&ne(e.weight)){const w=(""+e.weight).trim();core=(core?core+" ":"")+"@ "+w+(/\d$/.test(w)?" lb":"");}
  const detail=(e.detail==null?"":(""+e.detail)).trim();
  if(detail)core=(core?core+" ":"")+detail;
  return core.trim();
}
function parseDose(raw){
  const out={sets:"",metrics:[],reps:"",weight:"",time:"",timeUnit:"sec",dist:"",distUnit:"m",cal:"",detail:""};
  if(!raw||!(""+raw).trim())return out;
  let s=(""+raw).trim();
  const sm=s.match(/^(\d+)\s*[×xX]\s*(.*)$/);
  if(sm){out.sets=sm[1];s=sm[2].trim();}
  let rest=s;
  const vm=s.match(/^(\d+(?:\s*[–\-]\s*\d+)?(?:\.\d+)?)\s*(.*)$/);
  if(vm){
    const val=vm[1].replace(/\s+/g,""); rest=vm[2].trim();
    const um=rest.match(/^(mi|km|yd|m|secs?|s|mins?|cal|reps?|pumps)\b\.?/i);
    if(um){const u=um[1].toLowerCase();
      if(u==="mi"||u==="km"||u==="yd"||u==="m"){out.metrics.push("distance");out.dist=val;out.distUnit=u;}
      else if(u==="s"||u.indexOf("sec")===0){out.metrics.push("time");out.time=val;out.timeUnit="sec";}
      else if(u.indexOf("min")===0){out.metrics.push("time");out.time=val;out.timeUnit="min";}
      else if(u==="cal"){out.metrics.push("cal");out.cal=val;}
      else{out.metrics.push("reps");out.reps=val;}
      rest=rest.slice(um[0].length).trim();
    }else{out.metrics.push("reps");out.reps=val;}
  }
  const at=rest.indexOf("@");
  if(at>=0){const after=rest.slice(at+1).trim().replace(/\s*lb\.?$/i,"").trim();const before=rest.slice(0,at).trim();
    if(after){out.metrics.push("weight");out.weight=after;} rest=before;}
  out.detail=rest.trim();
  out.metrics=canonMetrics(out.metrics);
  return out;
}
function ensureMetrics(e){
  if(e&&!Array.isArray(e.metrics)){
    const p=parseDose(e.dose||"");
    e.sets=p.sets;e.metrics=p.metrics;e.reps=p.reps;e.weight=p.weight;e.time=p.time;e.timeUnit=p.timeUnit;e.dist=p.dist;e.distUnit=p.distUnit;e.cal=p.cal;e.detail=p.detail;
  }
  return e;
}
const MCHIP="display:inline-block;padding:3px 9px;border-radius:13px;font-size:12px;cursor:pointer;font-family:inherit;border:1.5px solid ";
function metricFieldsHTML(togCall,valCall,e){
  ensureMetrics(e);
  const tog=m=>togCall.replace("METRIC","'"+m+"'");
  const val=f=>valCall.replace("FIELD","'"+f+"'");
  const chips=METRIC_ORDER.map(m=>`<button type="button" style="${MCHIP}${hasM(e,m)?'#6a4f8f;background:#6a4f8f;color:#fff':'#d8dde3;background:#fff;color:#6b7884'}" onclick="${tog(m)}">${METRIC_LABEL[m]}</button>`).join(" ");
  const fld=inner=>`<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#6b7884;margin:0 10px 5px 0">${inner}</label>`;
  let flds="";
  if(hasM(e,"reps"))flds+=fld(`Reps <input class="in" style="max-width:72px" value="${esc(e.reps||"")}" placeholder="8–10" onchange="${val('reps')}">`);
  if(hasM(e,"weight"))flds+=fld(`Weight <input class="in" style="max-width:92px" value="${esc(e.weight||"")}" placeholder="135 / heavy" onchange="${val('weight')}">`);
  if(hasM(e,"time"))flds+=fld(`Time <input class="in" style="max-width:56px" value="${esc(e.time||"")}" placeholder="45" onchange="${val('time')}"><select class="in" style="max-width:62px" onchange="${val('timeUnit')}">${TIME_UNITS.map(u=>`<option ${e.timeUnit===u?'selected':''}>${u}</option>`).join("")}</select>`);
  if(hasM(e,"distance"))flds+=fld(`Dist <input class="in" style="max-width:56px" value="${esc(e.dist||"")}" placeholder="25" onchange="${val('dist')}"><select class="in" style="max-width:58px" onchange="${val('distUnit')}">${DIST_UNITS.map(u=>`<option ${e.distUnit===u?'selected':''}>${u}</option>`).join("")}</select>`);
  if(hasM(e,"cal"))flds+=fld(`Cal <input class="in" style="max-width:56px" value="${esc(e.cal||"")}" placeholder="15" onchange="${val('cal')}">`);
  return `<div style="margin-top:6px;padding:8px;border:1px solid #ece7f2;border-radius:9px;background:#faf9fc">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:12px">Sets</span><input class="in" style="max-width:46px;text-align:center" value="${esc(e.sets==null?"":e.sets)}" placeholder="3" onchange="${val('sets')}">${chips}</div>
    ${flds?`<div style="margin-top:8px">${flds}</div>`:`<div class="muted" style="font-size:12px;margin-top:6px">Tap a metric to prescribe it.</div>`}
    <input class="in" style="margin-top:5px" value="${esc(e.detail||"")}" placeholder="extra note — e.g. / side, tempo, RPE 8" onchange="${val('detail')}"></div>`;
}
function applyMetricToggle(e,m){
  ensureMetrics(e);
  if(hasM(e,m))e.metrics=e.metrics.filter(x=>x!==m);
  else{e.metrics=canonMetrics(e.metrics.concat(m));if(m==="time"&&!e.timeUnit)e.timeUnit="sec";if(m==="distance"&&!e.distUnit)e.distUnit="m";}
  e.dose=deriveDose(e);
}
function applyMetricVal(e,f,v){ensureMetrics(e);e[f]=v;e.dose=deriveDose(e);}
function exMTog(di,bi,ei,m){applyMetricToggle(curDays()[di].blocks[bi].ex[ei],m);renderEditor();}
function exMVal(di,bi,ei,f,v){applyMetricVal(curDays()[di].blocks[bi].ex[ei],f,v);}
function gMTog(i,m){applyMetricToggle(editingGroup.items[i],m);renderGroupEditor();}
function gMVal(i,f,v){applyMetricVal(editingGroup.items[i],f,v);}
function renderExEditor(di,bi,ei,e){ ensureMetrics(e);
  return `<div class="ex"><div class="reorder"><button title="Move up" onclick="moveEx(${di},${bi},${ei},-1)">▲</button><button title="Move down" onclick="moveEx(${di},${bi},${ei},1)">▼</button></div>
    <div class="grow">
      <input class="in" value="${esc(e.name||"")}" placeholder="Exercise name" onchange="setEx(${di},${bi},${ei},'name',this.value)">
      ${metricFieldsHTML(`exMTog(${di},${bi},${ei},METRIC)`,`exMVal(${di},${bi},${ei},FIELD,this.value)`,e)}
      <input class="in" style="margin-top:6px" value="${esc(e.cue||"")}" placeholder="Form cue (shown to athlete)" onchange="setEx(${di},${bi},${ei},'cue',this.value)">
      <input class="in" style="margin-top:6px" value="${esc(e.coachNote||"")}" placeholder="Coach note (your guidance)" onchange="setEx(${di},${bi},${ei},'coachNote',this.value)"></div>
    <div style="display:flex;flex-direction:column;gap:5px"><button class="btn ghost sm" title="Save to library" onclick="exToLibrary(${di},${bi},${ei})">★</button><button class="btn danger sm" onclick="delEx(${di},${bi},${ei})">✕</button></div></div>`;
}
function setDay(di,f,v){curDays()[di][f]=v;}
function setBlk(di,bi,f,v){curDays()[di].blocks[bi][f]=v;if(f==="kind")renderEditor();}
function setEx(di,bi,ei,f,v){curDays()[di].blocks[bi].ex[ei][f]=v;}
function addDay(){const used=editing.program.days.map(d=>d.dow);const next=DOWS.find(d=>!used.includes(d))||"Day";editing.program.days.push({dow:next,focus:"",badge:"",blocks:[]});renderEditor();}
function delDay(di){if(!confirm("Delete this whole day?"))return;editing.program.days.splice(di,1);renderEditor();}
function moveDay(di,dir){const a=editing.program.days,j=di+dir;if(j<0||j>=a.length)return;[a[di],a[j]]=[a[j],a[di]];renderEditor();}
function addBlock(di){const day=curDays()[di];day.rest=false;(day.blocks=day.blocks||[]).push({kind:"strength",tag:"Strength",title:"New block",sub:"",ex:[]});renderEditor();}
function delBlk(di,bi){curDays()[di].blocks.splice(bi,1);renderEditor();}
function moveBlk(di,bi,dir){const a=curDays()[di].blocks,j=bi+dir;if(j<0||j>=a.length)return;[a[bi],a[j]]=[a[j],a[bi]];renderEditor();}
function addBlankEx(di,bi){const day=curDays()[di];day.rest=false;const b=day.blocks[bi];(b.ex=b.ex||[]).push({name:"",dose:"",cue:"",coachNote:"",sets:"",metrics:["reps"],reps:"",weight:"",time:"",timeUnit:"sec",dist:"",distUnit:"m",cal:"",detail:""});renderEditor();}
function delEx(di,bi,ei){curDays()[di].blocks[bi].ex.splice(ei,1);renderEditor();}
function moveEx(di,bi,ei,dir){const a=curDays()[di].blocks[bi].ex,j=ei+dir;if(j<0||j>=a.length)return;[a[ei],a[j]]=[a[j],a[ei]];renderEditor();}
async function exToLibrary(di,bi,ei){
  const e=curDays()[di].blocks[bi].ex[ei];const kind=curDays()[di].blocks[bi].kind||"strength";
  if(!e.name||!e.name.trim()){toast("Give the exercise a name first",true);return;}
  try{await DB.libCreate({name:e.name.trim(),kind,dose:e.dose||null,cue:e.cue||null,note:e.coachNote||null});library=[];toast("Saved to library ★");}
  catch(e2){toast(/duplicate|unique/i.test(e2.message)?"Already in library":"Save failed",true);}
}
function cleanOverrides(){
  if(!editing.overrides)return;
  Object.keys(editing.overrides).forEach(k=>{const o=editing.overrides[k];
    const empty=!o.rest&&!(o.blocks&&o.blocks.length)&&!(o.focus&&o.focus.trim())&&!(o.note&&o.note.trim());
    if(empty)delete editing.overrides[k];});
}
async function saveProgram(){
  const btn=document.getElementById("saveProgBtn");btn.disabled=true;btn.textContent="Saving…";
  if(editing&&editing.isTemplate){
    try{await DB.tplUpdate(editing.id,{name:editing.name,program:editing.program});
      const i=templates.findIndex(t=>t.id===editing.id);if(i>=0)templates[i]={...templates[i],name:editing.name,program:JSON.parse(JSON.stringify(editing.program))};
      editing.__snap=JSON.stringify({p:editing.program,o:editing.overrides});renderEditor();
      toast("Template saved ✓");}
    catch(e){toast("Save failed: "+e.message.slice(0,60),true);}
    btn.disabled=false;btn.textContent="Save program";return;
  }
  cleanOverrides();
  try{await DB.update(editing.id,{program:editing.program,overrides:editing.overrides||{},name:editing.name,slug:editing.slug});toast("Saved ✓");const i=roster.findIndex(a=>a.id===editing.id);if(i>=0)roster[i]={...roster[i],program:editing.program,overrides:editing.overrides};editing.__snap=JSON.stringify({p:editing.program,o:editing.overrides});renderEditor();}
  catch(e){toast("Save failed: "+e.message.slice(0,60),true);}
  btn.disabled=false;btn.textContent="Save program";
}

async function openTemplates(){
  editing=null;
  document.getElementById("hCrumb").style.display="block";
  document.getElementById("hCrumb").textContent="← All athletes";
  document.getElementById("hTitle").textContent="Weekly templates";
  document.getElementById("savebar").style.display="none";
  try{templates=await DB.tplList();}catch(e){templates=[];toast("Couldn't load templates: "+e.message.slice(0,60),true);}
  renderTemplatesScreen();
}
function renderTemplatesScreen(){
  let h=`<div class="card"><div class="card-h"><h2>Weekly templates</h2><span class="muted">${templates.length} total</span><button class="btn primary sm" onclick="newTemplateForm()">+ New template</button></div>`;
  if(!templates.length)h+=`<div class="empty"><div class="big">No templates yet</div>Build a reusable weekly plan once, then apply it to any athlete.</div>`;
  else templates.forEach(t=>{
    const days=(t.program&&t.program.days)?t.program.days.length:0;
    h+=`<div class="roster-row" onclick="editTemplate('${t.id}')"><div class="avatar">🗂</div><div class="nm"><b>${esc(t.name)}</b><div class="slug">${days} day${days===1?"":"s"}</div></div>
      <button class="btn light sm" onclick="event.stopPropagation();applyTplForm('${t.id}')">Apply to athlete…</button>
      <button class="btn danger sm" onclick="event.stopPropagation();tplDelete('${t.id}')">✕</button>
      <div class="arrow">›</div></div>`;
  });
  h+=`</div><p class="muted" style="margin-left:4px">Tap a template to edit it. Applying copies it into an athlete's weekly program — their logs and one-off date plans are untouched.</p>`;
  document.getElementById("app").innerHTML=h;
}
function newTemplateForm(){
  const opts=roster.map(a=>`<option value="a:${a.id}">${esc(a.name)} — athlete's current week</option>`).join("")
    +templates.map(t=>`<option value="t:${t.id}">${esc(t.name)} — copy of template</option>`).join("");
  document.getElementById("modalRoot").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>New template</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="modal-b">
    <label class="fld"><span>Name</span><input class="in" id="tName" placeholder="e.g. Kona Build Week"></label>
    <label class="fld"><span>Start from…</span><select class="in" id="tFrom"><option value="">Blank (build from scratch)</option>${opts}</select></label>
    <div class="row2" style="margin-top:12px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createTemplate()">Create</button></div>
  </div></div></div>`;
}
async function createTemplate(){
  const name=document.getElementById("tName").value.trim();
  if(!name){toast("Name required",true);return;}
  const from=document.getElementById("tFrom").value;
  let program={days:[]};
  if(from.startsWith("a:")){const a=roster.find(x=>x.id===from.slice(2));if(a)program=JSON.parse(JSON.stringify(a.program||{days:[]}));}
  else if(from.startsWith("t:")){const t=templates.find(x=>x.id===from.slice(2));if(t)program=JSON.parse(JSON.stringify(t.program||{days:[]}));}
  try{const t=await DB.tplCreate({name,program});templates=await DB.tplList();closeModal();editTemplate(t.id);}
  catch(e){toast(/duplicate|unique/i.test(e.message)?"A template with that name already exists":"Create failed: "+e.message.slice(0,60),true);}
}
function editTemplate(id){
  const t=templates.find(x=>x.id===id);if(!t)return;
  editing={isTemplate:true,id:t.id,name:t.name,program:JSON.parse(JSON.stringify(t.program||{days:[]})),overrides:{}};
  if(!editing.program.days)editing.program.days=[];
  editing.__snap=JSON.stringify({p:editing.program,o:editing.overrides});
  progMode="weekly";progDate=null;editTab="program";
  document.getElementById("hCrumb").style.display="block";
  document.getElementById("hCrumb").textContent="← Templates";
  document.getElementById("hTitle").textContent="🗂 "+t.name;
  renderEditor();
}
async function tplDelete(id){
  if(!confirm("Delete this template? Athletes it was applied to keep their programs."))return;
  try{await DB.tplRemove(id);templates=templates.filter(t=>t.id!==id);renderTemplatesScreen();toast("Deleted");}catch(e){toast("Delete failed",true);}
}
function applyTplForm(id){
  const t=templates.find(x=>x.id===id);if(!t)return;
  if(!roster.length){toast("No athletes yet",true);return;}
  const opts=roster.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
  document.getElementById("modalRoot").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Apply "${esc(t.name)}"</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="modal-b">
    <label class="fld"><span>Athlete</span><select class="in" id="apAth">${opts}</select></label>
    <label class="fld"><span>How to apply</span><select class="in" id="apMode" onchange="document.getElementById('apRange').style.display=this.value==='range'?'block':'none';document.getElementById('apWeeklyNote').style.display=this.value==='range'?'none':'block'">
      <option value="range">Specific dates only (start → end)</option>
      <option value="weekly">Ongoing weekly plan (repeats every week)</option>
    </select></label>
    <div id="apRange"><div class="row2">
      <label class="fld"><span>Start date</span><input type="date" class="in" id="apStart" value="${todayISO()}"></label>
      <label class="fld"><span>End date</span><input type="date" class="in" id="apEnd" value="${todayISO()}"></label>
    </div>
    <p class="muted">Each date gets the template's matching weekday session, written as one-off date plans. Nothing repeats outside this range. Existing one-off plans on these dates are replaced; other dates and logs are untouched.</p></div>
    <p class="muted" id="apWeeklyNote" style="display:none">This replaces their current weekly program immediately and repeats every week until you change it. Their logs and one-off date plans are untouched.</p>
    <div class="row2" style="margin-top:12px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyTplToAthlete('${t.id}')">Apply</button></div>
  </div></div></div>`;
}
async function applyTplToAthlete(tplId){
  const t=templates.find(x=>x.id===tplId);const aid=document.getElementById("apAth").value;const a=roster.find(x=>x.id===aid);
  if(!t||!a)return;
  const mode=document.getElementById("apMode").value;
  if(mode==="weekly"){
    try{await DB.update(a.id,{program:JSON.parse(JSON.stringify(t.program||{days:[]}))});roster=await DB.list();closeModal();toast(`Weekly plan applied to ${a.name} ✓`);}
    catch(e){toast("Apply failed: "+e.message.slice(0,60),true);}
    return;
  }
  const s=document.getElementById("apStart").value, en=document.getElementById("apEnd").value;
  if(!s||!en||s>en){toast("Pick a valid start and end date",true);return;}
  if((new Date(en+"T00:00:00")-new Date(s+"T00:00:00"))/864e5>92){toast("Range too long — 92 days max",true);return;}
  const ov=JSON.parse(JSON.stringify(a.overrides||{}));
  let n=0;
  for(let d=new Date(s+"T00:00:00");iso(d)<=en;d.setDate(d.getDate()+1)){
    const dow=DOW_OF[d.getDay()];
    const day=(t.program.days||[]).find(x=>x.dow===dow);
    if(!day)continue;
    const copy=JSON.parse(JSON.stringify(day));delete copy.dow;
    ov[iso(d)]=copy;n++;
  }
  if(!n){toast("Template has no weekdays matching that range",true);return;}
  try{await DB.update(a.id,{overrides:ov});roster=await DB.list();closeModal();toast(`Planned ${n} day(s) for ${a.name} ✓`);}
  catch(e){toast("Apply failed: "+e.message.slice(0,60),true);}
}
async function applyTplHere(){
  if(!templates.length){try{templates=await DB.tplList();}catch(e){templates=[];}}
  if(!templates.length){toast("No templates saved yet — build one from the roster screen",true);return;}

}

async function saveAsTemplate(){
  const name=prompt("Template name:",(editing.name||"")+" — weekly");
  if(!name||!name.trim())return;
  try{await DB.tplCreate({name:name.trim(),program:JSON.parse(JSON.stringify(editing.program||{days:[]}))});templates=await DB.tplList();toast("Template saved ✓");}
  catch(e){toast(/duplicate|unique/i.test(e.message)?"A template with that name already exists":"Save failed: "+e.message.slice(0,60),true);}

function doneEditing(){
  if(isDirty()&&!confirm("You have unsaved changes. Discard them?"))return;
  if(editing&&editing.isTemplate)openTemplates();else goRoster();
}

/* add a saved group to one or more weekdays of the current athlete's program */
async function openAddGroup(di){
  if(!groups.length){try{groups=await DB.grpList();}catch(e){groups=[];}}
  if(progMode==='date'){agSel={groupId:(groups[0]?groups[0].id:null),dows:[],dateMode:true};renderAddGroup();return;}
  const curDow=editing.program.days[di]?editing.program.days[di].dow:"Mon";
  agSel={groupId:(groups[0]?groups[0].id:null),dows:[curDow]};
  renderAddGroup();
}
function renderAddGroup(){
  let h=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Add a saved group</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div><div class="modal-b">`;
  if(!groups.length)h+=`<div class="muted">No groups saved yet. Create one from the roster screen → 🧩 Groups.</div>`;
  else{
    h+=`<div class="muted" style="margin-bottom:6px">Choose a group</div>`;
    groups.forEach(g=>{h+=`<div class="libitem" onclick="agSel.groupId='${g.id}';renderAddGroup()" style="${agSel.groupId===g.id?'border-color:var(--navy);box-shadow:0 0 0 1.5px var(--navy) inset':''}"><div class="li-nm"><b>${esc(g.name)}</b> <span class="muted">· ${(g.items||[]).length} ex</span></div><span class="kindbadge ${esc(g.kind||'strength')}">${esc(g.kind||'')}</span></div>`;});
    if(agSel.dateMode){
      h+=`<div class="row2" style="margin-top:14px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyAddGroupDate()">Add to ${esc(progDate||"")}</button></div>`;
    }else{
      h+=`<div class="muted" style="margin:12px 0 6px">Add to which days? (repeats every week)</div><div class="row2" style="flex-wrap:wrap">`;
      DOWS.forEach(d=>{const on=agSel.dows.includes(d);h+=`<button class="btn ${on?'primary':'light'} sm" style="min-width:60px" onclick="toggleAgDow('${d}')">${d}</button>`;});
      h+=`</div><div class="row2" style="margin-top:14px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyAddGroup()">Add to ${agSel.dows.length} day${agSel.dows.length!==1?'s':''}</button></div>`;
    }
  }
  h+=`</div></div></div>`;document.getElementById("modalRoot").innerHTML=h;
}
function applyAddGroupDate(){
  const g=groups.find(x=>x.id===agSel.groupId);if(!g){toast("Pick a group",true);return;}
  const D=curDays();D[0].rest=false;(D[0].blocks=D[0].blocks||[]).push({kind:g.kind||"strength",tag:g.tag||g.kind||"",title:g.name,sub:"",ex:JSON.parse(JSON.stringify(g.items||[]))});
  closeModal();renderEditor();toast(`Added “${g.name}” to ${progDate}`);
}
function toggleAgDow(d){const i=agSel.dows.indexOf(d);if(i>=0)agSel.dows.splice(i,1);else agSel.dows.push(d);renderAddGroup();}
function applyAddGroup(){
  const g=groups.find(x=>x.id===agSel.groupId);if(!g){toast("Pick a group",true);return;}
  if(!agSel.dows.length){toast("Pick at least one day",true);return;}
  agSel.dows.forEach(dow=>{
    let day=editing.program.days.find(d=>d.dow===dow);
    if(!day){day={dow,focus:g.name,badge:"",blocks:[]};editing.program.days.push(day);}
    day.rest=false;day.blocks=day.blocks||[];
    day.blocks.push({kind:g.kind||"strength",tag:g.tag||g.kind||"",title:g.name,sub:"",ex:JSON.parse(JSON.stringify(g.items||[]))});
  });
  editing.program.days.sort((a,b)=>{const ia=DOWS.indexOf(a.dow),ib=DOWS.indexOf(b.dow);return (ia<0?99:ia)-(ib<0?99:ib);});
  const n=agSel.dows.length;closeModal();renderEditor();toast(`Added “${g.name}” to ${n} day${n!==1?"s":""} — remember to Save program`);
}

/* ---------------- Strava import ---------------- */
const STRAVA_CLIENT_ID="";  // paste your Strava app client ID here after creating it
const STRAVA_FUNC=SB_URL+"/functions/v1/strava-sync";
let stravaActs=null,stravaConnected=null;
function stravaRedirectUri(){return location.origin+location.pathname;}
async function stravaCall(payload){
  const r=await fetch(STRAVA_FUNC,{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok)throw new Error(d&&d.error?JSON.stringify(d.error):"strava call failed");
  return d;
}
function renderStrava(){
  let h=`<div class="card"><div class="card-b">
    <b>Import workouts from files</b>
    <p class="muted">Apple Watch: HealthFit app → auto-export TCX. Peloton: profile → Download Workouts (CSV). Drop one or many files below — HR, watts, pace come along.</p>
    <input type="file" id="impFiles" multiple accept=".tcx,.csv" onchange="filesChosen(this.files)" class="in">
    <div id="stravaList"></div>
  </div></div>`;
  if(STRAVA_CLIENT_ID){h+=`<div class="card"><div class="card-b" id="stravaBox"><div class="muted">Checking Strava connection…</div></div></div>`;setTimeout(stravaInit,0);}
  return h;
}
async function filesChosen(files){
  const acts=[];
  for(const f of files){
    try{
      const text=await f.text();
      if(/\.tcx$/i.test(f.name))acts.push(parseTCX(text,f.name));
      else if(/\.csv$/i.test(f.name)){
        const head1=(text.split(/\r?\n/)[0]||"").toLowerCase();
        if(head1.includes("activity date")&&head1.includes("activity id"))acts.push(...parseStravaCSV(text));
        else acts.push(...parsePelotonCSV(text));
      }
    }catch(e){console.error("parse fail",f.name,e);toast("Could not parse "+f.name,true);}
  }
  stravaActs=acts.filter(Boolean);
  renderActsTable();
}
function parseTCX(text,fname){
  const doc=new DOMParser().parseFromString(text,"text/xml");
  const act=doc.querySelector("Activity");
  if(!act)throw new Error("no Activity");
  const sport=act.getAttribute("Sport")||"Workout";
  const id=(act.querySelector("Id")||{}).textContent||fname;
  let time=0,dist=0,cal=0;const hrs=[],watts=[];
  act.querySelectorAll("Lap").forEach(l=>{
    time+=parseFloat((l.querySelector("TotalTimeSeconds")||{}).textContent||0);
    dist+=parseFloat((l.querySelector("DistanceMeters")||{}).textContent||0);
    cal+=parseFloat((l.querySelector("Calories")||{}).textContent||0);
  });
  act.querySelectorAll("Trackpoint").forEach(tp=>{
    const hr=tp.querySelector("HeartRateBpm Value");if(hr)hrs.push(+hr.textContent);
    const w=tp.getElementsByTagNameNS("*","Watts")[0];if(w&&w.textContent)watts.push(+w.textContent);
  });
  const avg=(a)=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  return {src:"tcx:"+id.trim(),name:sport+" ("+fname.replace(/\.tcx$/i,"")+")",type:sport,
    date:(id.trim()).slice(0,10)||"",moving_min:Math.round(time/60*10)/10,
    miles:dist?Math.round(dist/1609.34*100)/100:null,
    avg_hr:avg(hrs),max_hr:hrs.length?Math.max(...hrs):null,avg_watts:avg(watts),cal:cal?Math.round(cal):null};
}
function parseStravaCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return[];
  const parseLine=(l)=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;};
  const head=parseLine(lines[0]).map(h=>h.toLowerCase().trim());
  const idx=(frag)=>head.findIndex(h=>h===frag)>=0?head.findIndex(h=>h===frag):head.findIndex(h=>h.includes(frag));
  const iId=idx("activity id"),iDate=idx("activity date"),iName=idx("activity name"),iType=idx("activity type"),
        iMov=idx("moving time"),iDist=idx("distance"),iAhr=idx("average heart rate"),iMhr=idx("max heart rate"),iW=idx("average watts"),iCal=idx("calories");
  const num=(v)=>{const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
  return lines.slice(1).map(l=>{
    const r=parseLine(l);
    const id=r[iId];if(!id)return null;
    const d=new Date(r[iDate]);
    if(isNaN(d))return null;
    const date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const movS=num(r[iMov]);           // seconds in Strava export
    const distRaw=num(r[iDist]);       // km (may be meters in old exports)
    let miles=null;
    if(distRaw!=null)miles=Math.round((distRaw>1000?distRaw/1609.34:distRaw*0.621371)*100)/100;
    const hr=num(r[iAhr]),mhr=num(r[iMhr]),wt=num(r[iW]),cal=num(r[iCal]);
    return {src:"strava:"+String(id).trim(),name:r[iName]||r[iType]||"Activity",type:r[iType]||"",date,
      moving_min:movS!=null?Math.round(movS/60*10)/10:null,miles,
      avg_hr:hr==null?null:Math.round(hr),max_hr:mhr==null?null:Math.round(mhr),
      avg_watts:wt==null?null:Math.round(wt),cal:cal==null?null:Math.round(cal)};
  }).filter(Boolean);
}
function parsePelotonCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return[];
  const parseLine=(l)=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;};
  const head=parseLine(lines[0]).map(h=>h.toLowerCase());
  const col=(row,frag)=>{const i=head.findIndex(h=>h.includes(frag));return i>=0?(row[i]||""):"";};
  const num=(v)=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
  return lines.slice(1).map(l=>{
    const row=parseLine(l);
    const ts=col(row,"workout timestamp");
    if(!ts)return null;
    const date=(ts.match(/\d{4}-\d{2}-\d{2}/)||[ts.slice(0,10)])[0];
    const mins=num(col(row,"length"));
    const disc=col(row,"fitness discipline")||"Peloton";
    const title=col(row,"title")||disc;
    const hr=num(col(row,"heartrate"));
    const w=num(col(row,"avg. watts"));
    const c=num(col(row,"calories"));
    return {src:"pelo:"+ts.trim(),name:title,type:disc,date,moving_min:mins,
      miles:num(col(row,"distance")),avg_hr:hr==null?null:Math.round(hr),
      max_hr:null,avg_watts:w==null?null:Math.round(w),cal:c==null?null:Math.round(c)};
  }).filter(Boolean);
}
async function renderActsTable(){
  const list=document.getElementById("stravaList");
  if(!stravaActs||!stravaActs.length){list.innerHTML='<div class="muted">Nothing parsed.</div>';return;}
  if(!athLogs)try{athLogs=await DB.logs(editing.slug);}catch(e){athLogs=[];}
  const imported=new Set((athLogs||[]).map(l=>l.source_id).filter(Boolean));
  stravaActs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let h='<table class="tbl"><tr><th></th><th>Date</th><th>Activity</th><th>Type</th><th>Min</th><th>Mi</th><th>HR</th><th>W</th><th>Log as</th></tr>';
  stravaActs.forEach((a,i)=>{
    const done=imported.has(a.src||("strava:"+a.id));
    const names=cardioNamesFor(a.date);
    const opts=names.map(n=>`<option>${esc(n)}</option>`).join("")+`<option>${esc(a.name)}</option>`;
    h+=`<tr class="${done?'dim':''}"><td>${done?"✓":`<input type=checkbox data-si=${i} checked>`}</td><td>${esc(a.date)}</td><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${a.moving_min??""}</td><td>${a.miles??""}</td><td>${a.avg_hr??""}</td><td>${a.avg_watts??""}</td><td>${done?"imported":`<select class="in" data-sn=${i}>${opts}</select>`}</td></tr>`;
  });
  h+='</table><button class="btn" onclick="stravaImport()">Import checked</button>';
  list.innerHTML=h;
}
async function stravaInit(){
  const box=document.getElementById("stravaBox");if(!box)return;
  try{
    if(stravaConnected===null){const s=await stravaCall({action:"status",athlete_slug:editing.slug});stravaConnected=s.connected;}
    if(!stravaConnected){
      const url="https://www.strava.com/oauth/authorize?client_id="+STRAVA_CLIENT_ID+"&response_type=code&redirect_uri="+encodeURIComponent(stravaRedirectUri())+"&scope=activity:read_all&state="+encodeURIComponent(editing.slug);
      box.innerHTML=`<b>${esc(editing.name)} is not connected to Strava.</b><p class="muted">Connect authorizes read-only access to their activities.</p><a class="btn" href="${url}">Connect ${esc(editing.name)}'s Strava</a>`;
      return;
    }
    box.innerHTML=`<div class="row2"><b>Connected ✓</b><button class="btn light" onclick="stravaLoad(30)">Load last 30 days</button><button class="btn light" onclick="stravaLoad(90)">90 days</button></div><div id="stravaList"></div>`;
  }catch(e){box.innerHTML=`<div class="muted">Strava error: ${esc(String(e.message||e))}</div>`;}
}
async function stravaLoad(days){
  const list=document.getElementById("stravaList");list.innerHTML='<div class="muted">Loading activities…</div>';
  try{
    const after=Math.floor(Date.now()/1000)-days*86400;
    const d=await stravaCall({action:"activities",athlete_slug:editing.slug,after});
    stravaActs=(d.activities||[]).map(a=>({...a,src:"strava:"+a.id}));
    renderActsTable();
  }catch(e){list.innerHTML=`<div class="muted">Load failed: ${esc(String(e.message||e))}</div>`;}
}
function cardioNamesFor(ds){
  try{
    const ov=editing.overrides&&editing.overrides[ds];
    let day=ov;
    if(!day){const dt=new Date(ds+"T12:00:00");const dows=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];const dow=dows[dt.getDay()];day=(editing.program.days||[]).find(x=>x.dow===dow);}
    if(!day)return[];
    const out=[];
    (day.blocks||[]).forEach(b=>{if(b.kind==="cardio")(b.ex||[]).forEach(e=>out.push(e.name));});
    return out;
  }catch(e){return[];}
}
async function stravaImport(){
  const checks=[...document.querySelectorAll("input[data-si]:checked")];
  if(!checks.length){toast("Nothing checked",true);return;}
  const rows=checks.map(c=>{
    const a=stravaActs[+c.dataset.si];
    const sel=document.querySelector(`select[data-sn="${c.dataset.si}"]`);
    return {athlete_id:editing.id,athlete_slug:editing.slug,log_date:a.date,day_dow:null,day_focus:null,
      block_title:"Strava import",exercise_name:(sel&&sel.value)||a.name,set_number:1,reps:null,weight:null,weight_unit:null,
      completed:true,note:a.name,duration_min:a.moving_min,rpe:null,distance:a.miles,distance_unit:a.miles!=null?"mi":null,
      calories:a.cal,duration_sec:null,avg_hr:a.avg_hr,max_hr:a.max_hr,avg_watts:a.avg_watts,source_id:a.src||("strava:"+a.id)};
  });
  try{
    const r=await fetch(`${SB_URL}/rest/v1/logs`,{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json",Prefer:"resolution=ignore-duplicates"},body:JSON.stringify(rows)});
    if(!r.ok)throw new Error(await r.text());
    toast("Imported "+rows.length+" ✓");athLogs=null;renderActsTable();
  }catch(e){toast("Import failed",true);console.error(e);}
}
/* handle OAuth redirect back with ?code= */
(function(){
  const p=new URLSearchParams(location.search);
  const code=p.get("code"),slug=p.get("state");
  if(code&&slug){
    const iv=setInterval(async()=>{
      if(!AUTH.valid())return;
      clearInterval(iv);
      try{await stravaCall({action:"exchange",code,athlete_slug:slug});toast("Strava connected ✓");}
      catch(e){toast("Strava connect failed",true);}
      history.replaceState({},"",location.pathname);
    },400);
  }
})();
