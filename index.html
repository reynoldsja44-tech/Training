<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16324f">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ea;--card:#fffdf9;--ink:#22303c;--muted:#6b7884;--line:#e3dccd;
    --navy:#16324f;--strength:#3b6ea5;--cardio:#2f8f86;--accessory:#6a9a5b;--core:#c2754e;--bone:#6a72b8;
    --warn:#b06a2c;--warnbg:#fbeede;--ok:#2f8f86;
    --shadow:0 1px 3px rgba(40,50,60,.06),0 6px 20px rgba(40,50,60,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:18px;line-height:1.5;padding-bottom:120px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px;}
  header{padding:24px 16px 14px;text-align:center;background:linear-gradient(180deg,#16324f,#1c3e60);color:#f7f3ea;border-radius:0 0 22px 22px;box-shadow:var(--shadow);}
  header .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:0 0 4px;}
  header h1{font-family:"Fraunces",serif;font-weight:600;font-size:27px;margin:0;letter-spacing:-.01em;}
  header .who{font-size:13px;opacity:.8;margin:6px 0 0;}

  .days{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;margin:0 -16px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day-pill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;min-width:58px;text-align:center;cursor:pointer;transition:.15s;}
  .day-pill .dow{font-weight:700;font-size:15px;}
  .day-pill .fx{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.15;}
  .day-pill.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--shadow);}
  .day-pill.active .fx{color:rgba(255,255,255,.75);}
  .day-pill.today:not(.active){border-color:var(--cardio);}

  .toolbar{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;align-items:center;}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .chip:active{transform:scale(.97);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .datefield{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);}
  .datefield input{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card);color:var(--ink);}

  .day-head{margin:18px 2px 4px;}
  .day-head h2{font-family:"Fraunces",serif;font-weight:600;font-size:23px;margin:0;}
  .day-head .meta{color:var(--muted);font-size:14px;margin-top:2px;}
  .note-line{margin:8px 2px;font-size:14px;color:#46535f;background:#f3efe5;border-radius:10px;padding:9px 11px;}

  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden;}
  .block-head{padding:13px 15px 11px;border-left:5px solid var(--strength);}
  .block-head .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--strength);}
  .block-head h3{margin:2px 0 0;font-size:18px;font-weight:700;}
  .block-head .sub{font-size:13.5px;color:var(--muted);margin-top:2px;}
  .block.cardio .block-head{border-color:var(--cardio);}.block.cardio .tag{color:var(--cardio);}
  .block.accessory .block-head{border-color:var(--accessory);}.block.accessory .tag{color:var(--accessory);}
  .block.core .block-head{border-color:var(--core);}.block.core .tag{color:var(--core);}
  .bnote{margin:0 15px 11px;font-size:14px;border-radius:10px;padding:9px 11px;background:#eef0fb;color:#3f4674;}
  .bnote.warn{background:var(--warnbg);color:var(--warn);}
  .bnote.plain{background:#f3efe5;color:#46535f;}

  .exwrap{border-top:1px solid #f0ebdf;padding:12px 15px;}
  .exwrap:first-of-type{border-top:none;}
  .exrow{display:flex;gap:11px;align-items:flex-start;}
  .done-btn{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:.15s;}
  .done-btn svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.15s;}
  .exwrap.done .done-btn{background:var(--ok);border-color:var(--ok);}
  .exwrap.done .done-btn svg{opacity:1;transform:scale(1);}
  .ex-name{font-weight:600;font-size:16.5px;line-height:1.25;}
  .ex-dose{display:inline-block;font-size:13.5px;font-weight:700;color:var(--strength);background:#eaf1f8;border-radius:7px;padding:1px 8px;margin-top:4px;}
  .block.cardio .ex-dose{color:var(--cardio);background:#e3f2f0;}
  .block.accessory .ex-dose{color:#4f7a42;background:#eef4ea;}
  .block.core .ex-dose{color:var(--core);background:#f8ece4;}
  .ex-cue{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .ex-coachnote{font-size:13.5px;margin-top:6px;background:#eef3f9;border-left:3px solid var(--strength);border-radius:0 8px 8px 0;padding:6px 9px;color:#33485c;}
  .ex-coachnote b{color:var(--strength);}

  .sets{margin:10px 0 0;}
  .sets table{width:100%;border-collapse:collapse;}
  .sets th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:0 6px 4px;font-weight:700;}
  .sets td{padding:3px 6px 3px 0;}
  .sets td:first-child{width:30px;color:var(--muted);font-weight:700;font-size:14px;text-align:center;padding-right:8px;}
  .sets input{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:9px;padding:8px;background:#fff;color:var(--ink);text-align:center;}
  .sets input:focus{outline:none;border-color:var(--strength);}
  .setbtns{display:flex;gap:8px;margin-top:7px;}
  .mini{font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;font-family:inherit;color:var(--muted);font-weight:600;}
  .rm{width:30px;color:#b06a6a;border:none;background:none;font-size:18px;cursor:pointer;padding:0;}
  .exnote{width:100%;font-family:inherit;font-size:14.5px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:9px;background:#fff;color:var(--ink);resize:vertical;min-height:38px;}
  .lastval{font-size:12px;color:var(--muted);margin-top:5px;}

  .savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(247,243,234,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);}
  .savebar .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .save-btn{flex:1;background:var(--navy);color:#fff;border:none;border-radius:13px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;}
  .save-btn:active{transform:scale(.99);}
  .save-btn:disabled{opacity:.5;}
  .savecount{font-size:13px;color:var(--muted);white-space:nowrap;}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#9a3b3b;}

  .center{text-align:center;padding:60px 24px;color:var(--muted);}
  .center .big{font-family:"Fraunces",serif;font-size:24px;color:var(--ink);margin-bottom:8px;}
  .rest-day{text-align:center;padding:30px 20px;color:var(--muted);}
  .rest-day .big{font-family:"Fraunces",serif;font-size:24px;color:var(--ink);margin-bottom:6px;}

  .hist-day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:11px 0;box-shadow:var(--shadow);overflow:hidden;}
  .hist-day h4{margin:0;padding:12px 15px;font-size:16px;background:#f1ece1;}
  .hist-row{display:flex;gap:8px;align-items:center;padding:9px 15px;border-top:1px solid #f0ebdf;font-size:14.5px;flex-wrap:wrap;}
  .hist-row .hx{flex:1;min-width:120px;font-weight:600;}
  .hist-row input{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;color:var(--ink);width:62px;text-align:center;}
  .hist-row .hnote{flex-basis:100%;font-size:13px;color:var(--muted);}
  .hist-row .del{color:#b06a6a;border:none;background:none;font-size:16px;cursor:pointer;}
  footer{margin:24px 4px 0;font-size:12px;color:#9aa5af;line-height:1.5;}
</style>
</head>
<body>
<header>
  <p class="kicker">Training Log</p>
  <h1 id="title">Loading…</h1>
  <p class="who" id="subtitle"></p>
</header>

<div class="wrap"><div id="app"></div></div>

<div class="savebar" id="savebar" style="display:none;">
  <div class="inner">
    <span class="savecount" id="savecount"></span>
    <button class="save-btn" id="saveBtn">Save workout</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://rkuwuuwkymetibzfmilk.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdXd1dXdreW1ldGliemZtaWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTQ5MjcsImV4cCI6MjA5NjUzMDkyN30.k7YOMavSufOZC3d7gm2vX9KXXHfBPOQqtD0cms64WX8";
const REST = SB_URL + "/rest/v1";
const params = new URLSearchParams(location.search);
const SLUG = params.get("athlete");
const DEMO = params.get("demo") === "1";

const realDB = {
  async getAthlete(slug){
    const r=await fetch(`${REST}/athletes?slug=eq.${encodeURIComponent(slug)}&select=*`,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
    if(!r.ok)throw new Error(await r.text()); const rows=await r.json(); return rows[0]||null;
  },
  async getLogs(slug){
    const r=await fetch(`${REST}/logs?athlete_slug=eq.${encodeURIComponent(slug)}&order=log_date.desc,created_at.desc`,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
    if(!r.ok)throw new Error(await r.text()); return await r.json();
  },
  async insertLogs(rows){
    const r=await fetch(`${REST}/logs`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(rows)});
    if(!r.ok)throw new Error(await r.text()); return await r.json();
  },
  async updateLog(id,patch){
    const r=await fetch(`${REST}/logs?id=eq.${id}`,{method:"PATCH",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(patch)});
    if(!r.ok)throw new Error(await r.text());
  },
  async deleteLog(id){
    const r=await fetch(`${REST}/logs?id=eq.${id}`,{method:"DELETE",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
    if(!r.ok)throw new Error(await r.text());
  }
};

const DEMO_PROGRAM={days:[
  {dow:"Mon",focus:"Strength A + Arms",badge:"55–60 min",blocks:[
    {kind:"strength",tag:"Strength",title:"Strength A — legs + push",sub:"cable + dumbbells",
     noteBone:"Bone loading: 1–2 brief hard isometric holds, ~80% effort, 5–7 sec. Breathe throughout.",
     ex:[
      {name:"Goblet squat to box (DB)",dose:"3 × 8–10",cue:"Sit to a box, stand tall; heels down",coachNote:"Start light this week, focus on tempo."},
      {name:"Standing cable chest press",dose:"3 × 10–12",cue:"Staggered stance for balance"},
      {name:"Cable biceps curl",dose:"2 × 12",cue:"Elbows pinned; no swinging"},
     ]},
    {kind:"accessory",tag:"Accessory",title:"Neck · shoulder · wrist",sub:"~20 min",
     ex:[{name:"Neck CARs",dose:"3 / side",cue:"Big slow circles"},{name:"Wall slides",dose:"3 × 10",cue:"Ribs down; don't shrug"}]},
  ]},
  {dow:"Tue",focus:"Cardio (Zone 2)",badge:"55–60 min",blocks:[
    {kind:"cardio",tag:"Cardio",title:"Zone 2 — pick from menu",sub:"25–40 min",note:"Bike, rower, or Peloton walk. Conversational pace.",
     ex:[{name:"Zone 2 session",dose:"25–40 min",cue:"Talk test pace"}]},
  ]},
  {dow:"Sun",focus:"Rest",badge:"—",rest:true,blocks:[
    {kind:"accessory",tag:"Optional",title:"Rest or gentle movement",sub:"",note:"True rest, or a gentle stretch/Pilates class.",ex:[]},
  ]},
]};
function makeDemoDB(){
  let athlete={id:"demo-1",slug:SLUG||"demo",name:"Demo Athlete",program:DEMO_PROGRAM}; let logs=[]; let n=0;
  return {
    async getAthlete(){return athlete;},
    async getLogs(){return logs.slice().sort((a,b)=>(b.log_date+b.created_at).localeCompare(a.log_date+a.created_at));},
    async insertLogs(rows){const out=rows.map(r=>({...r,id:"d"+(++n),created_at:new Date().toISOString()}));logs.push(...out);return out;},
    async updateLog(id,patch){const l=logs.find(x=>x.id===id);if(l)Object.assign(l,patch);},
    async deleteLog(id){logs=logs.filter(x=>x.id!==id);}
  };
}
const DB = DEMO ? makeDemoDB() : realDB;

let athlete=null,program=null,logs=[],lastByEx={},selected=null,mode="train",sessionData={};
const dowOrder=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const todayDow=dowOrder[new Date().getDay()];
const fullDow=d=>({Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"}[d]||d);
const checkSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.className="toast show"+(err?" err":"");setTimeout(()=>t.className="toast",2200);}
function defaultSetCount(dose){const m=(dose||"").match(/(\d+)\s*[×x]/);return m?Math.min(parseInt(m[1]),6):1;}
function exKey(bi,ei){return bi+"-"+ei;}

async function init(){
  if(!SLUG && !DEMO){
    document.getElementById("title").textContent="Pick an athlete";
    document.getElementById("app").innerHTML=`<div class="center"><div class="big">No athlete in the link</div>Add <b>?athlete=name</b> to the address — e.g.<br><code>…/?athlete=mom</code></div>`;
    return;
  }
  try{ athlete=await DB.getAthlete(SLUG); }catch(e){ showError("Couldn't reach the database.",e); return; }
  if(!athlete){
    document.getElementById("title").textContent="Not found";
    document.getElementById("app").innerHTML=`<div class="center"><div class="big">No athlete called “${esc(SLUG)}”</div>Check the spelling, or add them on the coach page.</div>`;
    return;
  }
  program=athlete.program||{days:[]};
  document.getElementById("title").textContent=athlete.name;
  document.getElementById("subtitle").textContent="Tap ✓ as you go · enter weight & reps · save at the end";
  try{ logs=await DB.getLogs(SLUG); }catch(e){ logs=[]; }
  buildLastByEx();
  selected=program.days.some(d=>d.dow===todayDow)?todayDow:(program.days[0]&&program.days[0].dow);
  render();
}
function showError(msg,e){
  document.getElementById("title").textContent="Connection problem";
  document.getElementById("app").innerHTML=`<div class="center"><div class="big">${esc(msg)}</div><div style="font-size:13px;margin-top:8px;color:#b06a6a">${esc((e&&e.message)||"").slice(0,180)}</div></div>`;
}
function buildLastByEx(){lastByEx={};for(const l of logs){if(!lastByEx[l.exercise_name])lastByEx[l.exercise_name]={reps:l.reps,weight:l.weight,date:l.log_date};}}

function render(){
  if(mode==="history")return renderHistory();
  const app=document.getElementById("app");
  let html=renderDayPills();
  html+=`<div class="toolbar"><button class="chip on" onclick="setMode('train')">Today's workout</button><button class="chip" onclick="setMode('history')">History</button><span class="datefield">Date <input type="date" id="logdate" value="${todayISO()}"></span></div>`;
  const day=program.days.find(d=>d.dow===selected);
  if(!day){app.innerHTML=html;return;}
  html+=`<div class="day-head"><h2>${esc(fullDow(day.dow))}</h2><div class="meta">${esc(day.focus||"")}${day.badge?" · "+esc(day.badge):""}</div></div>`;
  if(day.note)html+=`<div class="note-line">${esc(day.note)}</div>`;
  if(day.rest){
    html+=`<div class="block accessory"><div class="rest-day"><div class="big">Rest day</div>${esc((day.blocks[0]&&day.blocks[0].note)||"Enjoy the recovery.")}</div></div>`;
    document.getElementById("savebar").style.display="none"; app.innerHTML=html; bindDayPills(); return;
  }
  (day.blocks||[]).forEach((b,bi)=>{
    html+=`<div class="block ${esc(b.kind||"strength")}">`;
    html+=`<div class="block-head"><div class="tag">${esc(b.tag||b.kind||"")}</div><h3>${esc(b.title||"")}</h3>${b.sub?`<div class="sub">${esc(b.sub)}</div>`:""}</div>`;
    if(b.note)html+=`<div class="bnote plain">${esc(b.note)}</div>`;
    if(b.noteBone)html+=`<div class="bnote">🦴 ${esc(b.noteBone)}</div>`;
    if(b.noteWarn)html+=`<div class="bnote warn">⚠︎ ${esc(b.noteWarn)}</div>`;
    (b.ex||[]).forEach((e,ei)=>{html+=renderExercise(b,bi,e,ei);});
    html+=`</div>`;
  });
  app.innerHTML=html; bindDayPills(); bindExercises(day);
  document.getElementById("savebar").style.display="block"; updateSaveCount();
}

function renderExercise(block,bi,e,ei){
  const key=exKey(bi,ei);
  const sd=sessionData[key]||(sessionData[key]={sets:[],note:"",done:false});
  const last=lastByEx[e.name];
  const isStrength=(block.kind==="strength")||((/×|x/.test(e.dose||""))&&block.kind!=="cardio");
  if(isStrength && sd.sets.length===0 && !sd._init){
    const n=defaultSetCount(e.dose);
    for(let i=0;i<n;i++)sd.sets.push({reps:last?last.reps:"",weight:(last&&last.weight!=null)?last.weight:""});
    sd._init=true;
  }
  let h=`<div class="exwrap ${sd.done?"done":""}" data-key="${key}">`;
  h+=`<div class="exrow"><div class="done-btn" data-done="${key}">${checkSVG}</div><div style="flex:1;min-width:0">`;
  h+=`<div class="ex-name">${esc(e.name)}</div>`;
  if(e.dose)h+=`<span class="ex-dose">${esc(e.dose)}</span>`;
  if(e.cue)h+=`<div class="ex-cue">${e.cue}</div>`;
  if(e.coachNote)h+=`<div class="ex-coachnote"><b>Coach:</b> ${esc(e.coachNote)}</div>`;
  if(isStrength){
    if(last)h+=`<div class="lastval">Last time: ${esc(last.reps||"–")} reps${last.weight!=null?" @ "+esc(last.weight)+" lb":""} (${esc(last.date)})</div>`;
    h+=`<div class="sets"><table><thead><tr><th></th><th>Reps</th><th>Weight (lb)</th><th></th></tr></thead><tbody data-sets="${key}">`;
    sd.sets.forEach((s,si)=>{h+=setRow(key,si,s);});
    h+=`</tbody></table><div class="setbtns"><button class="mini" data-addset="${key}">+ Add set</button></div></div>`;
  }
  h+=`<textarea class="exnote" data-note="${key}" placeholder="Her note (how it felt, any tweak)…">${esc(sd.note)}</textarea>`;
  h+=`</div></div></div>`; return h;
}
function setRow(key,si,s){
  return `<tr data-row="${si}"><td>${si+1}</td>
    <td><input inputmode="numeric" data-f="reps" data-k="${key}" data-i="${si}" value="${esc(s.reps)}" placeholder="–"></td>
    <td><input inputmode="decimal" data-f="weight" data-k="${key}" data-i="${si}" value="${esc(s.weight)}" placeholder="–"></td>
    <td><button class="rm" data-rmset="${key}" data-i="${si}">×</button></td></tr>`;
}
function bindExercises(){
  document.querySelectorAll("[data-done]").forEach(el=>el.onclick=()=>{
    const k=el.getAttribute("data-done");sessionData[k].done=!sessionData[k].done;
    el.closest(".exwrap").classList.toggle("done",sessionData[k].done);updateSaveCount();
  });
  document.querySelectorAll("input[data-f]").forEach(inp=>inp.oninput=()=>{const k=inp.dataset.k;sessionData[k].sets[+inp.dataset.i][inp.dataset.f]=inp.value;sessionData[k].touched=true;updateSaveCount();});
  document.querySelectorAll("textarea[data-note]").forEach(t=>t.oninput=()=>{sessionData[t.dataset.note].note=t.value;updateSaveCount();});
  document.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{
    const k=b.getAttribute("data-addset");const sets=sessionData[k].sets;const ls=sets[sets.length-1]||{reps:"",weight:""};
    sets.push({reps:ls.reps,weight:ls.weight});sessionData[k].touched=true;redrawSets(k);updateSaveCount();
  });
  document.querySelectorAll("[data-rmset]").forEach(b=>b.onclick=()=>{
    const k=b.getAttribute("data-rmset");if(sessionData[k].sets.length<=1)return;
    sessionData[k].sets.splice(+b.dataset.i,1);redrawSets(k);updateSaveCount();
  });
}
function rebindSetControls(k){
  document.querySelectorAll(`input[data-k="${k}"]`).forEach(inp=>inp.oninput=()=>{sessionData[k].sets[+inp.dataset.i][inp.dataset.f]=inp.value;sessionData[k].touched=true;updateSaveCount();});
  document.querySelectorAll(`[data-rmset="${k}"]`).forEach(b=>b.onclick=()=>{if(sessionData[k].sets.length<=1)return;sessionData[k].sets.splice(+b.dataset.i,1);redrawSets(k);updateSaveCount();});
}
function redrawSets(k){const tb=document.querySelector(`[data-sets="${k}"]`);if(!tb)return;tb.innerHTML=sessionData[k].sets.map((s,si)=>setRow(k,si,s)).join("");rebindSetControls(k);}

function hasData(sd){return !!(sd.done || (sd.note&&sd.note.trim()!=="") || sd.touched);}
function updateSaveCount(){
  let n=0;Object.values(sessionData).forEach(sd=>{if(hasData(sd))n++;});
  document.getElementById("savecount").textContent=n?`${n} exercise${n>1?"s":""} ready`:"Nothing logged yet";
  document.getElementById("saveBtn").disabled=n===0;
}

async function saveWorkout(){
  const day=program.days.find(d=>d.dow===selected);
  const date=document.getElementById("logdate").value||todayISO();
  const rows=[];
  (day.blocks||[]).forEach((b,bi)=>(b.ex||[]).forEach((e,ei)=>{
    const sd=sessionData[exKey(bi,ei)];if(!sd||!hasData(sd))return;
    const realSets=sd.sets.filter(s=>(s.reps!=="" && s.reps!=null)||(s.weight!=="" && s.weight!=null));
    if(realSets.length){
      realSets.forEach((s,si)=>rows.push({athlete_id:athlete.id,athlete_slug:athlete.slug,log_date:date,day_dow:day.dow,day_focus:day.focus||null,block_title:b.title||null,exercise_name:e.name,set_number:si+1,reps:(s.reps===""?null:String(s.reps)),weight:(s.weight===""||s.weight==null?null:parseFloat(s.weight)),completed:true,note:si===0?(sd.note||null):null}));
    }else{
      rows.push({athlete_id:athlete.id,athlete_slug:athlete.slug,log_date:date,day_dow:day.dow,day_focus:day.focus||null,block_title:b.title||null,exercise_name:e.name,set_number:1,reps:null,weight:null,completed:true,note:sd.note||null});
    }
  }));
  if(!rows.length){toast("Nothing to save yet");return;}
  const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="Saving…";
  try{
    await DB.insertLogs(rows);
    logs=await DB.getLogs(SLUG);buildLastByEx();sessionData={};toast("Workout saved ✓");render();
  }catch(e){toast("Save failed — try again",true);console.error(e);btn.disabled=false;}
  btn.textContent="Save workout";
}

function renderDayPills(){
  let h=`<div class="days" id="days">`;
  program.days.forEach(d=>{
    const sf=d.rest?"Rest":(d.focus||"").split("+")[0].trim().split(" ").slice(0,2).join(" ");
    h+=`<div class="day-pill ${d.dow===selected?"active":""} ${d.dow===todayDow?"today":""}" data-dow="${esc(d.dow)}"><div class="dow">${esc(d.dow)}</div><div class="fx">${esc(sf)}</div></div>`;
  });
  return h+`</div>`;
}
function bindDayPills(){document.querySelectorAll(".day-pill").forEach(p=>p.onclick=()=>{selected=p.getAttribute("data-dow");sessionData={};render();});}
function setMode(m){mode=m;sessionData={};render();}

function renderHistory(){
  const app=document.getElementById("app");
  let html=renderDayPills();
  html+=`<div class="toolbar"><button class="chip" onclick="setMode('train')">Today's workout</button><button class="chip on" onclick="setMode('history')">History</button></div>`;
  if(!logs.length){app.innerHTML=html+`<div class="center"><div class="big">No history yet</div>Saved workouts show up here, and you can edit or delete any entry.</div>`;bindDayPills();document.getElementById("savebar").style.display="none";return;}
  const byDate={};logs.forEach(l=>{(byDate[l.log_date]=byDate[l.log_date]||[]).push(l);});
  Object.keys(byDate).sort().reverse().forEach(date=>{
    const rows=byDate[date];const focus=rows[0].day_focus||rows[0].day_dow||"";
    html+=`<div class="hist-day"><h4>${esc(date)} <span style="color:#6b7884;font-weight:400;font-size:13px">${esc(focus)}</span></h4>`;
    rows.forEach(l=>{
      html+=`<div class="hist-row" data-id="${l.id}"><span class="hx">${esc(l.exercise_name)} <span style="color:#6b7884;font-weight:400">· set ${l.set_number}</span></span>
        <label style="font-size:12px;color:#6b7884">reps <input data-h="reps" value="${esc(l.reps||"")}"></label>
        <label style="font-size:12px;color:#6b7884">lb <input data-h="weight" value="${esc(l.weight!=null?l.weight:"")}"></label>
        <button class="del" data-del="${l.id}">🗑</button>
        ${l.note?`<div class="hnote">📝 ${esc(l.note)}</div>`:""}</div>`;
    });
    html+=`</div>`;
  });
  app.innerHTML=html;bindDayPills();document.getElementById("savebar").style.display="none";
  document.querySelectorAll(".hist-row input[data-h]").forEach(inp=>inp.onchange=async()=>{
    const id=inp.closest(".hist-row").dataset.id,f=inp.dataset.h;let v=inp.value;const patch={};patch[f]=f==="weight"?(v===""?null:parseFloat(v)):(v===""?null:v);
    try{await DB.updateLog(id,patch);toast("Updated ✓");const l=logs.find(x=>x.id===id);if(l)l[f]=patch[f];buildLastByEx();}catch(e){toast("Update failed",true);}
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this entry?"))return;
    try{await DB.deleteLog(b.dataset.del);logs=logs.filter(x=>x.id!==b.dataset.del);buildLastByEx();toast("Deleted");renderHistory();}catch(e){toast("Delete failed",true);}
  });
}

document.getElementById("saveBtn").onclick=saveWorkout;
init();
</script>
</body>
</html>
