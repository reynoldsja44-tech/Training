<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16324f">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ea;--card:#fffdf9;--ink:#22303c;--muted:#6b7884;--line:#e3dccd;
    --navy:#16324f;--strength:#3b6ea5;--cardio:#2f8f86;--accessory:#6a9a5b;--core:#c2754e;--bone:#6a72b8;--extra:#8a6fb0;
    --warn:#b06a2c;--warnbg:#fbeede;--ok:#2f8f86;
    --shadow:0 1px 3px rgba(40,50,60,.06),0 6px 20px rgba(40,50,60,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:18px;line-height:1.5;padding-bottom:120px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px;}
  header{padding:24px 16px 14px;text-align:center;background:linear-gradient(180deg,#16324f,#1c3e60);color:#f7f3ea;border-radius:0 0 22px 22px;box-shadow:var(--shadow);}
  header .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:0 0 4px;}
  header h1{font-family:"Fraunces",serif;font-weight:600;font-size:27px;margin:0;letter-spacing:-.01em;}
  header .who{font-size:13px;opacity:.8;margin:6px 0 0;}

  .days{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;margin:0 -16px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day-pill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;min-width:58px;text-align:center;cursor:pointer;transition:.15s;}
  .day-pill .dow{font-weight:700;font-size:15px;}
  .day-pill .fx{font-size:13px;color:#4a5763;font-weight:600;margin-top:1px;line-height:1.2;}
  .day-pill.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--shadow);}
  .day-pill.active .fx{color:rgba(255,255,255,.75);}
  .day-pill.today:not(.active){border-color:var(--cardio);}

  .toolbar{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;align-items:center;}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .chip:active{transform:scale(.97);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .datefield{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);}
  .datefield input{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card);color:var(--ink);}

  .day-head{margin:18px 2px 4px;}
  .day-head h2{font-family:"Fraunces",serif;font-weight:600;font-size:23px;margin:0;}
  .day-head .meta{color:#3a4754;font-size:17px;font-weight:700;margin-top:3px;line-height:1.3;}
  .note-line{margin:8px 2px;font-size:15.5px;color:#46535f;background:#f3efe5;border-radius:10px;padding:9px 11px;}

  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden;}
  .block-head{padding:13px 15px 11px;border-left:5px solid var(--strength);display:flex;align-items:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
  .clp-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .clp-count{font-size:12.5px;font-weight:800;color:var(--muted);background:#f0ece2;border-radius:999px;padding:2px 9px;}
  .caret{font-size:19px;color:var(--muted);transition:transform .15s ease;line-height:1;}
  .block.clps .caret{transform:rotate(-90deg);}
  .block.clps .block-body{display:none;}
  .block-head .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--strength);}
  .block-head h3{margin:2px 0 0;font-size:19.5px;font-weight:700;}
  .block-head .sub{font-size:15px;color:var(--muted);margin-top:2px;}
  .block.cardio .block-head{border-color:var(--cardio);}.block.cardio .tag{color:var(--cardio);}
  .block.accessory .block-head{border-color:var(--accessory);}.block.accessory .tag{color:var(--accessory);}
  .block.core .block-head{border-color:var(--core);}.block.core .tag{color:var(--core);}
  .block.extra .block-head{border-color:var(--extra);}.block.extra .tag{color:var(--extra);}
  .bnote{margin:0 15px 11px;font-size:15.5px;border-radius:10px;padding:9px 11px;background:#eef0fb;color:#3f4674;}
  .bnote.warn{background:var(--warnbg);color:var(--warn);}
  .bnote.plain{background:#f3efe5;color:#46535f;}

  .exwrap{border-top:1px solid #f0ebdf;padding:12px 15px;}
  .exwrap:first-of-type{border-top:none;}
  .exrow{display:flex;gap:11px;align-items:flex-start;}
  .done-btn{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:.15s;}
  .done-btn svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.15s;}
  .exwrap.done .done-btn{background:var(--ok);border-color:var(--ok);}
  .exwrap.done .done-btn svg{opacity:1;transform:scale(1);}
  .ex-name{font-weight:600;font-size:18px;line-height:1.25;}
  .ex-dose{display:inline-block;font-size:15px;font-weight:700;color:var(--strength);background:#eaf1f8;border-radius:7px;padding:1px 8px;margin-top:4px;}
  .block.cardio .ex-dose{color:var(--cardio);background:#e3f2f0;}
  .block.accessory .ex-dose{color:#4f7a42;background:#eef4ea;}
  .block.core .ex-dose{color:var(--core);background:#f8ece4;}
  .ex-cue{font-size:15px;color:#5a6773;margin-top:4px;line-height:1.42;}
  .ex-coachnote{font-size:15px;margin-top:6px;background:#eef3f9;border-left:3px solid var(--strength);border-radius:0 8px 8px 0;padding:6px 9px;color:#33485c;}
  .ex-coachnote b{color:var(--strength);}

  .sets{margin:10px 0 0;}
  .sets table{width:100%;border-collapse:collapse;}
  .sets th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:0 6px 4px;font-weight:700;}
  .sets td{padding:3px 6px 3px 0;}
  .sets td:first-child{width:30px;color:var(--muted);font-weight:700;font-size:14px;text-align:center;padding-right:8px;}
  .sets input{width:100%;font-family:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:9px;padding:8px;background:#fff;color:var(--ink);text-align:center;}
  .sets input:focus{outline:none;border-color:var(--strength);}
  .setbtns{display:flex;gap:8px;margin-top:7px;}
  .mini{font-size:14px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;font-family:inherit;color:var(--muted);font-weight:600;}
  .rm{width:30px;color:#b06a6a;border:none;background:none;font-size:18px;cursor:pointer;padding:0;}
  .exnote{width:100%;font-family:inherit;font-size:15.5px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:9px;background:#fff;color:var(--ink);resize:vertical;min-height:38px;}
  .lastval{font-size:13.5px;color:var(--muted);margin-top:5px;}

  .cardio-fields{margin-top:10px;}
  .cardio-fields .row2{display:flex;gap:9px;margin-top:8px;}
  .cardio-fields .row2>label{flex:1;}
  .cardio-fields label{display:block;font-size:13.5px;color:var(--muted);font-weight:700;}
  .cardio-fields input,.cardio-fields select{width:100%;font-family:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink);margin-top:3px;}
  .cardio-fields input:focus,.cardio-fields select:focus{outline:none;border-color:var(--cardio);}

  .kindtoggle{display:flex;gap:7px;margin:8px 0;}
  .kindtoggle button{flex:1;font-size:13.5px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--muted);}
  .kindtoggle button.on{background:var(--extra);border-color:var(--extra);color:#fff;}
  .extra-name{width:100%;font-family:inherit;font-size:16px;font-weight:600;border:1.5px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink);}

  .savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(247,243,234,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);}
  .savebar .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .save-btn{flex:1;background:var(--navy);color:#fff;border:none;border-radius:13px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;}
  .save-btn:active{transform:scale(.99);}
  .save-btn:disabled{opacity:.5;}
  .savecount{font-size:13px;color:var(--muted);white-space:nowrap;}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#9a3b3b;}

  .center{text-align:center;padding:60px 24px;color:var(--muted);}
  .center .big{font-family:"Fraunces",serif;font-size:24px;color:var(--ink);margin-bottom:8px;}
  .rest-day{text-align:center;padding:30px 20px;color:var(--muted);}
  .rest-day .big{font-family:"Fraunces",serif;font-size:24px;color:var(--ink);margin-bottom:6px;}

  .hist-day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:11px 0;box-shadow:var(--shadow);overflow:hidden;}
  .hist-day h4{margin:0;padding:12px 15px;font-size:16px;background:#f1ece1;}
  .hist-row{display:flex;gap:8px;align-items:center;padding:9px 15px;border-top:1px solid #f0ebdf;font-size:15.5px;flex-wrap:wrap;}
  .hist-row .hx{flex:1;min-width:120px;font-weight:600;}
  .hist-row input{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;color:var(--ink);width:62px;text-align:center;}
  .hist-row .hnote{flex-basis:100%;font-size:13px;color:var(--muted);}
  .hist-row .del{color:#b06a6a;border:none;background:none;font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<header>
  <p class="kicker">Training Log</p>
  <h1 id="title">Loading…</h1>
  <p class="who" id="subtitle"></p>
</header>

<div class="wrap"><div id="app"></div></div>

<div class="savebar" id="savebar" style="display:none;">
  <div class="inner">
    <span class="savecount" id="savecount"></span>
    <button class="save-btn" id="saveBtn">Save workout</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="printRoot" aria-hidden="true"></div>
<style id="pageOrient"></style>
<script>
const SB_URL="https://rkuwuuwkymetibzfmilk.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdXd1dXdreW1ldGliemZtaWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTQ5MjcsImV4cCI6MjA5NjUzMDkyN30.k7YOMavSufOZC3d7gm2vX9KXXHfBPOQqtD0cms64WX8";
const REST=SB_URL+"/rest/v1";
const params=new URLSearchParams(location.search);
const SLUG=params.get("athlete");
const DEMO=params.get("demo")==="1";

const realDB={
  async getAthlete(slug){const r=await fetch(`${REST}/athletes?slug=eq.${encodeURIComponent(slug)}&select=*`,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw new Error(await r.text());return (await r.json())[0]||null;},
  async getLogs(slug){const r=await fetch(`${REST}/logs?athlete_slug=eq.${encodeURIComponent(slug)}&order=log_date.desc,created_at.desc`,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw new Error(await r.text());return r.json();},
  async insertLogs(rows){const r=await fetch(`${REST}/logs`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(rows)});if(!r.ok)throw new Error(await r.text());return r.json();},
  async updateLog(id,patch){const r=await fetch(`${REST}/logs?id=eq.${id}`,{method:"PATCH",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());},
  async deleteLog(id){const r=await fetch(`${REST}/logs?id=eq.${id}`,{method:"DELETE",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw new Error(await r.text());},
  async deleteLogsFor(slug,date,name){const r=await fetch(`${REST}/logs?athlete_slug=eq.${encodeURIComponent(slug)}&log_date=eq.${date}&exercise_name=eq.${encodeURIComponent(name)}`,{method:"DELETE",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw new Error(await r.text());},
  async updateAthlete(id,patch){const r=await fetch(`${REST}/athletes?id=eq.${id}`,{method:"PATCH",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());}
};
const DEMO_PROGRAM={days:[
  {dow:"Mon",focus:"Strength A + Arms",badge:"55–60 min",blocks:[
    {kind:"strength",tag:"Strength",title:"Strength A — legs + push",sub:"cable + dumbbells",
     ex:[{name:"Goblet squat to box (DB)",dose:"3 × 8–10",cue:"Heels down",coachNote:"Start light."},{name:"Cable biceps curl",dose:"2 × 12",cue:"Elbows pinned"}]},
    {kind:"accessory",tag:"Accessory",title:"Neck · shoulder",sub:"",ex:[{name:"Neck CARs",dose:"3 / side",cue:"Slow circles"}]}]},
  {dow:"Tue",focus:"Cardio (Zone 2)",badge:"55 min",blocks:[
    {kind:"cardio",tag:"Cardio",title:"Zone 2",sub:"25–40 min",note:"Conversational pace.",ex:[{name:"Zone 2 session",dose:"25–40 min",cue:"Talk-test pace"}]}]},
  {dow:"Sun",focus:"Rest",badge:"—",rest:true,blocks:[{kind:"accessory",tag:"Optional",title:"Rest",sub:"",note:"Recover.",ex:[]}]},
]};
function makeDemoDB(){let athlete={id:"demo-1",slug:SLUG||"demo",name:"Demo Athlete",program:DEMO_PROGRAM,overrides:{}};let logs=[];let n=0;
  return {async getAthlete(){return athlete;},async getLogs(){return logs.slice().sort((a,b)=>(b.log_date+b.created_at).localeCompare(a.log_date+a.created_at));},
    async insertLogs(rows){const out=rows.map(r=>({...r,id:"d"+(++n),created_at:new Date().toISOString()}));logs.push(...out);return out;},
    async updateLog(id,patch){const l=logs.find(x=>x.id===id);if(l)Object.assign(l,patch);},async deleteLog(id){logs=logs.filter(x=>x.id!==id);},async deleteLogsFor(slug,date,name){logs=logs.filter(x=>!(x.log_date===date&&x.exercise_name===name));},async updateAthlete(id,patch){Object.assign(athlete,patch);}};}
const DB=DEMO?makeDemoDB():realDB;

let athlete=null,program=null,logs=[],selDate=null,mode="day",backfill=false,sessionData={},extras=[];
let workouts=[],editingWorkout=null;
let calMonth=new Date();
let collapsed={};
function clpKey(bi){return selDate+"|"+bi;}
function toggleBlock(id,headEl){collapsed[id]=!collapsed[id];headEl.closest(".block").classList.toggle("clps",!!collapsed[id]);}
const dowOrder=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fullDow=d=>({Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"}[d]||d);
const checkSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
function isoOf(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function todayISO(){return isoOf(new Date());}
function shiftISO(ds,delta){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+delta);return isoOf(d);}
function dowOf(ds){return dowOrder[new Date(ds+"T00:00:00").getDay()];}
function niceDate(ds){return new Date(ds+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.className="toast show"+(err?" err":"");setTimeout(()=>t.className="toast",2200);}
function defaultSetCount(dose){const m=(dose||"").match(/(\d+)\s*[×x]/);return m?Math.min(parseInt(m[1]),6):1;}
function exKey(bi,ei){return bi+"-"+ei;}
function exStyle(block,e){if((block.kind||"")==="cardio")return"cardio";return"typed";}
/* ---- structured type model (shared with coach editor) ---- */
const TIME_UNITS=["sec","min"];
function parseDose(raw){
  const out={sets:"",reps:"",repType:"reps",repUnit:"",detail:""};
  if(!raw||!(""+raw).trim()){out.repType="";return out;}
  let s=(""+raw).trim();
  const sm=s.match(/^(\d+)\s*[×xX]\s*(.*)$/);
  if(sm){out.sets=sm[1];s=sm[2].trim();}
  const vm=s.match(/^(\d+(?:\s*[–\-]\s*\d+)?(?:\.\d+)?)\s*(.*)$/);
  if(vm){
    out.reps=vm[1].replace(/\s+/g,"");
    let rest=vm[2].trim();
    const um=rest.match(/^(mi|km|yd|m|secs?|s|mins?|cal|reps?|pumps)\b\.?/i);
    if(um){const u=um[1].toLowerCase();
      if(u==="mi"){out.repType="distance";out.repUnit="mi";}
      else if(u==="km"){out.repType="distance";out.repUnit="km";}
      else if(u==="yd"){out.repType="distance";out.repUnit="yd";}
      else if(u==="m"){out.repType="distance";out.repUnit="m";}
      else if(u==="s"||u.indexOf("sec")===0){out.repType="time";out.repUnit="sec";}
      else if(u.indexOf("min")===0){out.repType="time";out.repUnit="min";}
      else if(u==="cal"){out.repType="cal";out.repUnit="";}
      else{out.repType="reps";}
      rest=rest.slice(um[0].length).trim();
    }else{out.repType="reps";}
    out.detail=rest;
  }else{out.sets="";out.reps="";out.repType="";out.detail=s;}
  return out;
}
/* effective type of a program exercise: reps | time | distance | cal */
function exType(e){
  if(e&&e.repType){return e.repType==="cal"?"cal":e.repType;}
  const p=parseDose((e&&e.dose)||"");
  return p.repType||"reps";
}
function exUnit(e){ if(e&&e.repUnit)return e.repUnit; const p=parseDose((e&&e.dose)||""); return p.repUnit||""; }
function numOrNull(v){return (v===""||v==null)?null:(isNaN(parseFloat(v))?null:parseFloat(v));}
function valLabel(type){return type==="time"?"Time":type==="distance"?"Distance":type==="cal"?"Calories":"Reps";}
function typeUnitOptions(type,cur){
  const opts=type==="time"?TIME_UNITS:(type==="distance"?DIST_UNITS:[]);
  if(!opts.length)return"";
  return `<select class="unitsel">${opts.map(u=>`<option value="${u}" ${cur===u?"selected":""}>${u}</option>`).join("")}</select>`;
}
function programForDow(dow){return (program.days||[]).find(d=>d.dow===dow);}
function dayForDate(date){
  const ov=(athlete&&athlete.overrides)?athlete.overrides[date]:null;
  if(ov&&(ov.rest||(ov.blocks&&ov.blocks.length)||(ov.focus&&String(ov.focus).trim())||(ov.note&&String(ov.note).trim())))return Object.assign({},ov,{dow:dowOf(date),_override:true});
  return programForDow(dowOf(date));
}
function logsForDate(date){return logs.filter(l=>l.log_date===date);}
function loggedForExOnDate(name,date){return logs.filter(l=>l.exercise_name===name&&l.log_date===date).sort((a,b)=>(a.set_number||0)-(b.set_number||0));}

function lastSessionFor(name,beforeDate){
  const rows=logs.filter(l=>l.exercise_name===name&&l.log_date<beforeDate);
  if(!rows.length)return null;
  let d=rows[0].log_date;for(const l of rows)if(l.log_date>d)d=l.log_date;
  const sess=rows.filter(l=>l.log_date===d).sort((a,b)=>(a.set_number||0)-(b.set_number||0));
  return {date:d,rows:sess};
}
function rowVal(r){
  if(r.reps!=null)return ""+r.reps;
  if(r.duration_sec!=null)return r.duration_sec+" sec";
  if(r.duration_min!=null)return r.duration_min+" min";
  if(r.distance!=null)return r.distance+" "+(r.distance_unit||"");
  if(r.calories!=null)return r.calories+" cal";
  return "–";
}
function summarizeRows(rows){
  if(!rows||!rows.length)return"";
  const r0=rows[0];
  const isRep = r0.reps!=null || (r0.duration_min==null&&r0.duration_sec==null&&r0.distance==null&&r0.calories==null);
  if(!isRep && rows.length===1){
    let s=rowVal(r0); if(r0.weight!=null)s+=" @ "+r0.weight+" lb"; if(r0.rpe!=null)s+=" · RPE "+r0.rpe; return s;
  }
  const vals=rows.map(rowVal);
  const wts=[...new Set(rows.map(r=>r.weight).filter(w=>w!=null))];
  const w=wts.length===1?` @ ${wts[0]} lb`:(wts.length>1?` @ ${Math.min(...wts)}–${Math.max(...wts)} lb`:"");
  return `${rows.length} set${rows.length>1?"s":""} · ${vals.join(", ")}${isRep?" reps":""}${w}`;
}
function fmtLast(name){
  const s=lastSessionFor(name,selDate);if(!s)return"";
  return `Last (${s.date}): ${summarizeRows(s.rows)}`;
}

/* ---------------- main render ---------------- */
function render(){
  if(mode==="history")return renderHistory();

  const app=document.getElementById("app");
  let html=renderDateNav();

  if(past && !backfill){
    html+=renderLoggedDay(day,dateLogs);
    app.innerHTML=html;document.getElementById("savebar").style.display="none";bindLogEdits();return;
  }
  // program-logging view (today / future / back-fill)

    html+=`<div class="day-head"><h2>${niceDate(selDate)}</h2></div><div class="center"><div class="big">No workout scheduled</div>Nothing is programmed for ${fullDow(dowOf(selDate))}.${renderExtrasWrap()}</div>`;

    html+=`<div class="block accessory"><div class="rest-day"><div class="big">Rest day</div>${esc((day.blocks[0]&&day.blocks[0].note)||"Enjoy the recovery.")}</div></div>`;
    html+=renderExtras();app.innerHTML=html;bindExtras();document.getElementById("savebar").style.display="block";updateSaveCount();return;
  }
  (day.blocks||[]).forEach((b,bi)=>{
    const ck=clpKey("b"+bi),isC=!!collapsed[ck];
    const nEx=(b.ex||[]).length;
    html+=`<div class="block ${esc(b.kind||"strength")} ${isC?"clps":""}"><div class="block-head" onclick="toggleBlock('${ck}',this)"><div style="flex:1;min-width:0"><div class="tag">${esc(b.tag||b.kind||"")}</div><h3>${esc(b.title||"")}</h3>${b.sub?`<div class="sub">${esc(b.sub)}</div>`:""}</div><div class="clp-right"><span class="clp-count">${nEx}</span><span class="caret">▾</span></div></div><div class="block-body">`;

/* ---------------- logged (past) day ---------------- */
function loggedRow(l){
  const isSet = l.reps!=null || (l.duration_min==null&&l.duration_sec==null&&l.distance==null&&l.calories==null&&l.rpe==null);
  const fld=(lab,f,val,extra="")=>`<label style="font-size:12px;color:#6b7884">${lab} <input data-h="${f}" value="${esc(val==null?"":val)}" ${extra}></label>`;
  let h=`<div class="hist-row" data-id="${l.id}"><span class="hx">${esc(l.exercise_name)}${isSet?` <span style="color:#6b7884;font-weight:400">· set ${l.set_number}</span>`:""}</span>`;
  if(isSet){ h+=fld("reps","reps",l.reps)+fld("lb","weight",l.weight); }
  else {
    if(l.duration_min!=null)h+=fld("min","duration_min",l.duration_min);
    if(l.duration_sec!=null)h+=fld("sec","duration_sec",l.duration_sec);
    if(l.distance!=null){h+=fld("dist","distance",l.distance,'style="width:52px"');const uopts=DIST_UNITS.map(u=>`<option value="${u}" ${(l.distance_unit||"mi")===u?"selected":""}>${u}</option>`).join("");h+=`<select data-h="distance_unit" style="font-size:12px">${uopts}</select>`;}
    if(l.calories!=null)h+=fld("cal","calories",l.calories);
    if(l.weight!=null)h+=fld("lb","weight",l.weight);
    if(l.rpe!=null)h+=fld("RPE","rpe",l.rpe);
  }
  h+=`<button class="del" data-del="${l.id}">🗑</button>${l.note?`<div class="hnote">📝 ${esc(l.note)}</div>`:""}</div>`;
  return h;
}
function renderLoggedDay(day,dateLogs){
  let h=`<div class="day-head"><h2>${niceDate(selDate)}</h2><div class="meta">${dateLogs.length?esc(dateLogs[0].day_focus||"Logged"):"Nothing logged"}</div></div>`;
  if(!dateLogs.length){
    h+=`<div class="center"><div class="big">Nothing logged this day</div>${day&&!day.rest?`The plan for ${fullDow(dowOf(selDate))} was <b>${esc(day.focus||"")}</b>.`:(day&&day.rest?"This was a scheduled rest day.":"")}<div style="margin-top:16px"><button class="chip on" onclick="startBackfill()">Log this day</button></div></div>`;
    return h;
  }
  const byBlock={};dateLogs.forEach(l=>{(byBlock[l.block_title||"Workout"]=byBlock[l.block_title||"Workout"]||[]).push(l);});
  Object.keys(byBlock).forEach(bt=>{h+=`<div class="hist-day"><h4>${esc(bt)}</h4>`;byBlock[bt].forEach(l=>{h+=loggedRow(l);});h+=`</div>`;});
  h+=`<div style="text-align:center;margin:16px"><button class="chip" onclick="startBackfill()">+ Log more for this day</button></div>`;
  return h;
}

/* ---------------- exercise (program-logging) ---------------- */
function renderExercise(block,bi,e,ei,dateLogs){
  const key=exKey(bi,ei);
  const sd=sessionData[key]||(sessionData[key]={sets:[],note:"",done:false,activity:"",duration:"",rpe:""});
  const last=lastSessionFor(e.name,selDate);
  let style=exStyle(block,e);
  if(style==="typed" && !(e.dose&&(""+e.dose).trim())) style="done";
  const type=(style==="typed")?exType(e):null;
  if(style==="typed"){
    if(sd.unit==null)sd.unit=exUnit(e)||(type==="distance"?guessUnit(e.name):(type==="time"?"sec":""));
    if(sd.sets.length===0 && !sd._init){
      const n=defaultSetCount(e.dose);const lw=(type==="reps"&&last&&last.rows[0]&&last.rows[0].weight!=null)?last.rows[0].weight:"";
      for(let i=0;i<n;i++)sd.sets.push({reps:"",weight:lw});
      sd._init=true;
    }
  }
  if(style==="cardio" && !sd._init){sd.activity=e.name;sd._init=true;}
  const already=loggedForExOnDate(e.name,selDate);
  let h=`<div class="exwrap ${sd.done?"done":""}" data-key="${key}">`;
  h+=`<div class="exrow"><div class="done-btn" data-done="${key}">${checkSVG}</div><div style="flex:1;min-width:0">`;
  h+=`<div class="ex-name">${esc(e.name)}</div>`;
  if(e.dose)h+=`<span class="ex-dose">${esc(e.dose)}</span>`;
  if(e.cue)h+=`<div class="ex-cue">${e.cue}</div>`;
  if(e.coachNote)h+=`<div class="ex-coachnote"><b>Coach:</b> ${esc(e.coachNote)}</div>`;
  const lt=fmtLast(e.name);if(lt)h+=`<div class="lastval">⟲ ${esc(lt)}</div>`;
  if(already.length){h+=`<div class="logged-badge">✓ Logged this day: ${esc(summarizeRows(already))} — re-saving replaces it</div>`;}
  if(style==="typed"){
    const hasUnit=(type==="time"||type==="distance");
    const vhdr=valLabel(type)+(hasUnit?` <span style="font-weight:400;color:#6b7884">(${esc(sd.unit)})</span>`:"");
    h+=`<div class="sets"><table><thead><tr><th></th><th>${vhdr}</th><th>Weight (lb)</th><th></th></tr></thead><tbody data-sets="${key}">`;
    sd.sets.forEach((s,si)=>{h+=setRow(key,si,s);});
    h+=`</tbody></table><div class="setbtns"><button class="mini" data-addset="${key}">+ Add set</button>`;
    if(hasUnit){const opts=(type==="time"?TIME_UNITS:DIST_UNITS).map(u=>`<option value="${u}" ${sd.unit===u?"selected":""}>${u}</option>`).join("");h+=`<span style="margin-left:10px;font-size:12px;color:#6b7884">unit <select data-unit="${key}">${opts}</select></span>`;}
    h+=`</div></div>`;
  }else if(style==="cardio"){
    h+=renderCardioFields(key,sd,e);
  }
  h+=`<textarea class="exnote" data-note="${key}" placeholder="Note (how it felt, any tweak)…">${esc(sd.note)}</textarea>`;
  h+=`</div></div></div>`;return h;
}
const DIST_UNITS=["mi","km","m","yd"];
function guessUnit(name){return /swim/i.test(name||"")?"m":"mi";}
function renderCardioFields(key,sd,e){
  if(sd.dunit==null)sd.dunit=guessUnit((e&&e.name)||sd.activity);

    <div class="row2"><label>Distance<input data-cf="distance" data-k="${key}" inputmode="decimal" value="${esc(sd.distance||"")}" placeholder="optional"></label>
    <label>Unit<select data-cf="dunit" data-k="${key}">${uopts}</select></label></div></div>`;
}
function setRow(key,si,s){
  return `<tr data-row="${si}"><td>${si+1}</td>

function bindExercises(){

function rebindSetControls(k){

function redrawSets(k){const tb=document.querySelector(`[data-sets="${k}"]`);if(!tb)return;tb.innerHTML=sessionData[k].sets.map((s,si)=>setRow(k,si,s)).join("");rebindSetControls(k);}

/* ---------------- athlete-built workouts ---------------- */
function deriveDose(e){
  const sets=(e.sets==null?"":(""+e.sets)).trim();
  const reps=(e.reps==null?"":(""+e.reps)).trim();
  const t=e.repType||"",unit=e.repUnit||"";
  const detail=(e.detail==null?"":(""+e.detail)).trim();
  let core="";
  if(reps){const ul=(t==="distance"||t==="time")?unit:(t==="cal"?"cal":"");const val=reps+(ul?(" "+ul):"");core=(sets!=="")?(sets+" × "+val):val;}
  else if(sets!=="")core=sets+" ×";
  let out=core; if(detail)out=out?(out+" "+detail):detail; return out.trim();
}
const WIN='font-family:inherit;font-size:15px;border:1.5px solid #d8dde3;border-radius:8px;padding:8px;background:#fff;color:inherit';

const EXTRA_TYPES=[["reps","Reps"],["time","Time"],["distance","Distance"],["cal","Cal"],["cardio","Cardio"]];
function renderExtraCard(x,xi){
  if(x.type==null)x.type=(x.kind==="cardio")?"cardio":"reps";
  let h=`<div class="exwrap" data-extra="${xi}"><div style="flex:1">`;
  h+=`<input class="extra-name" data-ex="name" data-xi="${xi}" value="${esc(x.name||"")}" placeholder="What did you do?">`;
  if(x.target)h+=`<div class="sub" style="margin:3px 2px 0">🎯 Target: ${esc(x.target)}</div>`;
  h+=`<div class="kindtoggle">${EXTRA_TYPES.map(t=>`<button data-extype="${t[0]}" data-xi="${xi}" class="${x.type===t[0]?'on':''}">${t[1]}</button>`).join("")}</div>`;
  if(x.type==="cardio"){
    let opts='<option value="">Effort 1–10</option>';for(let i=1;i<=10;i++)opts+=`<option value="${i}" ${String(x.rpe)===String(i)?'selected':''}>${i}</option>`;
    if(x.dunit==null)x.dunit=guessUnit(x.name);
    const uopts=DIST_UNITS.map(u=>`<option value="${u}" ${x.dunit===u?"selected":""}>${u}</option>`).join("");
    h+=`<div class="cardio-fields"><div class="row2"><label>Minutes<input data-ex="duration" data-xi="${xi}" inputmode="numeric" value="${esc(x.duration||"")}" placeholder="min"></label><label>Effort<select data-ex="rpe" data-xi="${xi}">${opts}</select></label></div>
    <div class="row2"><label>Distance<input data-ex="distance" data-xi="${xi}" inputmode="decimal" value="${esc(x.distance||"")}" placeholder="optional"></label><label>Unit<select data-ex="dunit" data-xi="${xi}">${uopts}</select></label></div></div>`;
  }else{
    const type=x.type,hasUnit=(type==="time"||type==="distance");
    if(hasUnit&&x.unit==null)x.unit=(type==="distance"?guessUnit(x.name):"sec");
    const vhdr=valLabel(type)+(hasUnit?` <span style="font-weight:400;color:#6b7884">(${esc(x.unit)})</span>`:"");
    h+=`<div class="sets"><table><thead><tr><th></th><th>${vhdr}</th><th>Weight (lb)</th><th></th></tr></thead><tbody data-exsets="${xi}">`;
    (x.sets||[]).forEach((s,si)=>{h+=extraSetRow(xi,si,s);});
    h+=`</tbody></table><div class="setbtns"><button class="mini" data-exaddset="${xi}">+ Add set</button>`;
    if(hasUnit){const opts=(type==="time"?TIME_UNITS:DIST_UNITS).map(u=>`<option value="${u}" ${x.unit===u?"selected":""}>${u}</option>`).join("");h+=`<span style="margin-left:10px;font-size:12px;color:#6b7884">unit <select data-exunit="${xi}">${opts}</select></span>`;}
    h+=`</div></div>`;
  }
  h+=`<textarea class="exnote" data-ex="note" data-xi="${xi}" placeholder="Note…">${esc(x.note||"")}</textarea>`;
  h+=`<div style="margin-top:7px"><button class="mini" data-exrm="${xi}" style="color:#b06a6a">Remove</button></div></div></div>`;return h;
}
function extraSetRow(xi,si,s){return `<tr><td>${si+1}</td><td><input inputmode="numeric" data-exs="reps" data-xi="${xi}" data-i="${si}" value="${esc(s.reps)}" placeholder="–"></td><td><input inputmode="decimal" data-exs="weight" data-xi="${xi}" data-i="${si}" value="${esc(s.weight)}" placeholder="–"></td><td></td></tr>`;}
function bindExtras(){
  const add=document.getElementById("addExtraBtn");
  if(add)add.onclick=()=>{extras.push({name:"",type:"reps",unit:"",sets:[{reps:"",weight:""}],duration:"",rpe:"",note:""});render();};
  document.querySelectorAll("[data-ex]").forEach(el=>{el.oninput=el.onchange=()=>{const xi=+el.dataset.xi;extras[xi][el.dataset.ex]=el.value;updateSaveCount();};});
  document.querySelectorAll("[data-extype]").forEach(b=>b.onclick=()=>{const xi=+b.dataset.xi;const t=b.getAttribute("data-extype");extras[xi].type=t;if(t!=="cardio"&&(!extras[xi].sets||!extras[xi].sets.length))extras[xi].sets=[{reps:"",weight:""}];if(t==="time"&&!extras[xi].unit)extras[xi].unit="sec";if(t==="distance"&&!extras[xi].unit)extras[xi].unit=guessUnit(extras[xi].name);render();});
  document.querySelectorAll("[data-exs]").forEach(inp=>inp.oninput=()=>{const xi=+inp.dataset.xi;extras[xi].sets[+inp.dataset.i][inp.dataset.exs]=inp.value;updateSaveCount();});

function hasData(sd){return !!(sd.done||(sd.note&&sd.note.trim()!=="")||sd.touched);}
function extraHasData(x){return !!((x.name&&x.name.trim())||x.note||x.duration||x.rpe||x.distance||(x.sets&&x.sets.some(s=>s.reps||s.weight)));}
function updateSaveCount(){
  let n=0;Object.values(sessionData).forEach(sd=>{if(hasData(sd))n++;});extras.forEach(x=>{if(extraHasData(x))n++;});
  const el=document.getElementById("savecount");if(el)el.textContent=n?`${n} item${n>1?"s":""} ready`:"Nothing logged yet";
  const sb=document.getElementById("saveBtn");if(sb)sb.disabled=n===0;
}

function typedRows(base,name,type,unit,sets,note){
  const out=[];
  const real=(sets||[]).filter(s=>(s.reps!==""&&s.reps!=null)||(s.weight!==""&&s.weight!=null));
  if(!real.length){out.push({...base,exercise_name:name,set_number:1,reps:null,weight:null,note:note||null});return out;}
  real.forEach((s,si)=>{
    const row={...base,exercise_name:name,set_number:si+1,note:si===0?(note||null):null};
    const v=s.reps;
    if(type==="time"){ if((unit||"sec")==="sec")row.duration_sec=numOrNull(v); else row.duration_min=numOrNull(v); row.weight=numOrNull(s.weight); }
    else if(type==="distance"){ row.distance=numOrNull(v); row.distance_unit=unit||"mi"; row.weight=numOrNull(s.weight); }
    else if(type==="cal"){ row.calories=numOrNull(v); row.weight=numOrNull(s.weight); }
    else { row.reps=(v===""||v==null)?null:String(v); row.weight=numOrNull(s.weight); }
    out.push(row);
  });
  return out;
}

async function saveWorkout(){
  const day=dayForDate(selDate);
  const date=selDate;const rows=[];
  if(day && !day.rest){
    (day.blocks||[]).forEach((b,bi)=>(b.ex||[]).forEach((e,ei)=>{
      const sd=sessionData[exKey(bi,ei)];if(!sd||!hasData(sd))return;
      let style=exStyle(b,e); if(style==="typed"&&!(e.dose&&(""+e.dose).trim()))style="done";
      const base={athlete_id:athlete.id,athlete_slug:athlete.slug,log_date:date,day_dow:day.dow,day_focus:day.focus||null,block_title:b.title||null,completed:true};
      if(style==="cardio")rows.push({...base,exercise_name:(sd.activity||e.name),set_number:1,reps:null,weight:null,duration_min:sd.duration?parseFloat(sd.duration):null,rpe:sd.rpe?parseFloat(sd.rpe):null,distance:sd.distance?parseFloat(sd.distance):null,distance_unit:sd.distance?(sd.dunit||"mi"):null,note:sd.note||null});
      else if(style==="typed"){const type=exType(e);const unit=sd.unit||exUnit(e)||(type==="distance"?guessUnit(e.name):(type==="time"?"sec":""));typedRows(base,e.name,type,unit,sd.sets,sd.note).forEach(r=>rows.push(r));}
      else rows.push({...base,exercise_name:e.name,set_number:1,reps:null,weight:null,note:sd.note||null});
    }));
  }
  extras.forEach(x=>{
    if(!extraHasData(x))return;
    const base={athlete_id:athlete.id,athlete_slug:athlete.slug,log_date:date,day_dow:(day&&day.dow)||dowOf(selDate),day_focus:(day&&day.focus)||null,block_title:"Added by athlete",completed:true};
    const xt=x.type||(x.kind==="cardio"?"cardio":"reps");
    if(xt==="cardio")rows.push({...base,exercise_name:x.name||"Extra cardio",set_number:1,reps:null,weight:null,duration_min:x.duration?parseFloat(x.duration):null,rpe:x.rpe?parseFloat(x.rpe):null,distance:x.distance?parseFloat(x.distance):null,distance_unit:x.distance?(x.dunit||"mi"):null,note:x.note||null});
    else{const unit=x.unit||(xt==="distance"?guessUnit(x.name):(xt==="time"?"sec":""));typedRows(base,x.name||"Extra",xt,unit,x.sets,x.note).forEach(r=>rows.push(r));}
  });
  if(!rows.length){toast("Nothing to save yet");return;}
  const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="Saving…";
  try{
    const names=[...new Set(rows.map(r=>r.exercise_name))];
    for(const nm of names){try{await DB.deleteLogsFor(athlete.slug,date,nm);}catch(_){}}
    await DB.insertLogs(rows);
    logs=await DB.getLogs(SLUG);sessionData={};extras=[];backfill=false;toast("Saved ✓");render();
  }catch(e){toast("Save failed — try again",true);console.error(e);btn.disabled=false;}
  btn.textContent="Save workout";
}

function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function buildPrintDay(ds){
  const fmt=new Date(ds+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  const day=dayForDate(ds);
  let h=`<div class="pw-day"><div class="pw-dayhead"><span class="pw-date">${esc(fmt)}</span>${day&&day._override?`<span class="pw-badge">★</span>`:""}</div>`;
  if(day&&day.focus)h+=`<div class="pw-focus">${esc(day.focus)}${day.badge?` <span class="pw-badge">${esc(day.badge)}</span>`:""}</div>`;
  if(!day){h+=`<div class="pw-empty">No workout scheduled</div></div>`;return h;}
  if(day.note)h+=`<div class="pw-note">${esc(day.note)}</div>`;
  const hasEx=(day.blocks||[]).some(b=>(b.ex||[]).length>0);
  if(day.rest&&!hasEx){h+=`<div class="pw-empty">Rest day${(day.blocks&&day.blocks[0]&&day.blocks[0].note)?" — "+esc(day.blocks[0].note):""}</div></div>`;return h;}
  if(!hasEx&&!day.note){h+=`<div class="pw-empty">Nothing planned</div></div>`;return h;}
  (day.blocks||[]).forEach(b=>{
    if(!(b.ex||[]).length&&!b.note)return;
    h+=`<div class="pw-block"><div class="pw-btitle">${esc(b.title||b.tag||"")}${b.sub?` <span class="pw-bsub">· ${esc(b.sub)}</span>`:""}</div>`;
    if(b.note)h+=`<div class="pw-bnote">${esc(b.note)}</div>`;
    (b.ex||[]).forEach(e=>{
      h+=`<div class="pw-ex"><span class="pw-exname">${esc(e.name||"")}</span>${e.dose?`<span class="pw-exdose">${esc(e.dose)}</span>`:""}${e.cue?`<div class="pw-excue">${esc(e.cue)}</div>`:""}</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;return h;
}

function buildSheetHTML(start,nDays){
  const end=addDays(start,nDays-1);
  const fmtShort=ds=>new Date(ds+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const range=nDays===1?fmtShort(start):`${fmtShort(start)} – ${fmtShort(end)}`;
  let h=`<div class="pw-sheet ${nDays===1?"single":"week"}">
    <div class="pw-head"><div class="pw-name">${esc(athlete&&athlete.name||"")}</div><div class="pw-range">Training plan · ${range}</div></div>
    <div class="pw-days">`;
  for(let i=0;i<nDays;i++)h+=buildPrintDay(addDays(start,i));
  h+=`</div><div class="pw-foot">Printed ${new Date().toLocaleDateString()} · plan may change — check your page for the latest</div></div>`;
  return h;
}
function printSheet(start,nDays){
  const orient=nDays===1?"portrait":"landscape";
  // printable area for US Letter minus 8mm margins, in CSS px (96dpi)
  const bodyW=nDays===1?756:996, availH=nDays===1?996:756;
  const base=nDays===1?14:9, minS=nDays===1?9:6.5, maxS=14;
  try{
    const f=document.createElement("iframe");
    f.setAttribute("aria-hidden","true");
    f.style.cssText=`position:fixed;right:0;bottom:0;width:${bodyW}px;height:10px;border:0;visibility:hidden;pointer-events:none;`;
    document.body.appendChild(f);
    const d=f.contentDocument;
    d.open();
    d.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Training plan</title><style>@page{size:${orient};margin:8mm;}html,body{margin:0;padding:0;}body{width:${bodyW}px;}${PW_CSS}</style></head><body>${buildSheetHTML(start,nDays)}</body></html>`);
    d.close();
    const sheet=d.querySelector(".pw-sheet");
    // auto-fit: grow or shrink type to fill exactly one page
    let size=base;
    for(let i=0;i<5;i++){
      sheet.style.fontSize=size+"px";
      const h=sheet.scrollHeight;
      if(!h)break; // no layout engine (shouldn't happen in real browsers)
      if(h>availH)size=Math.max(minS,size*Math.max(.7,(availH/h)*.97));
      else if(h<availH*.88&&size<maxS)size=Math.min(maxS,size*Math.min(1.25,(availH/h)*.95));
      else break;
    }
    sheet.style.fontSize=size+"px";
    if(sheet.scrollHeight>availH&&size>minS)sheet.style.fontSize=Math.max(minS,size*(availH/sheet.scrollHeight)*.97)+"px";
    f.contentWindow.focus();
    f.contentWindow.print();
    setTimeout(()=>{try{f.remove();}catch(e){}},60000);
  }catch(e){
    // fallback: in-page print via printRoot
    document.getElementById("printRoot").innerHTML=buildSheetHTML(start,nDays);
    document.getElementById("pageOrient").textContent=`@page{size:${orient};margin:8mm;}@media print{body>*{display:none !important;}body>#printRoot{display:block !important;}body{background:#fff !important;margin:0 !important;padding:0 !important;height:auto !important;}#printRoot .pw-sheet{font-size:${base}px;}${PW_CSS}}`;
    window.print();
  }
}

    const cls=["acal-cell",ds===tISO?"today":"",ds===selDate?"sel":"",ds<tISO?"past":""].join(" ");
    html+=`<div class="${cls}" onclick="onDateChange('${ds}')" title="${esc(focus)}"><div class="acal-cell-top"><span class="acal-num">${dn}</span>${mark}</div>${focus?`<div class="acal-focus">${esc(focus)}</div>`:""}</div>`;
  }
  html+=`</div>

}

  Object.keys(byDate).sort().reverse().forEach(date=>{
    const rows=byDate[date];const focus=rows[0].day_focus||rows[0].day_dow||"";
    html+=`<div class="hist-day"><h4><a href="#" onclick="onDateChange('${date}');return false;" style="color:inherit;text-decoration:none">${esc(date)}</a> <span style="color:#6b7884;font-weight:400;font-size:13px">${esc(focus)}</span></h4>`;
    rows.forEach(l=>{html+=loggedRow(l);});
    html+=`</div>`;
  });
  app.innerHTML=html;document.getElementById("savebar").style.display="none";bindLogEdits();
}

/* shared inline edit/delete for logged rows (history + past day) */
function bindLogEdits(){
  document.querySelectorAll(".hist-row input[data-h], .hist-row select[data-h]").forEach(inp=>inp.onchange=async()=>{
    const id=inp.closest(".hist-row").dataset.id,f=inp.dataset.h;let v=inp.value;const patch={};const numeric=(f!=="reps"&&f!=="distance_unit");patch[f]=numeric?(v===""?null:parseFloat(v)):(v===""?null:v);
    try{await DB.updateLog(id,patch);toast("Updated ✓");const l=logs.find(x=>x.id===id);if(l)l[f]=patch[f];}catch(e){toast("Update failed",true);}
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this entry?"))return;try{await DB.deleteLog(b.dataset.del);logs=logs.filter(x=>x.id!==b.dataset.del);toast("Deleted");render();}catch(e){toast("Delete failed",true);}});
}

document.getElementById("saveBtn").onclick=saveWorkout;
init();
</script>
